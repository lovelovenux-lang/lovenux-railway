<script>

let currentUser=null;
let savedProfiles=JSON.parse(localStorage.getItem('lovenux_saved_profiles')||'{}');
let isLoggedIn = localStorage.getItem('lovenux_isLoggedIn')==='true';
if(isLoggedIn){ try{ currentUser=JSON.parse(localStorage.getItem('lovenux_v2_user')||'null'); }catch{} if(currentUser && savedProfiles[currentUser.id]){ let sp=savedProfiles[currentUser.id]; if(sp.profilePic) currentUser.profilePic=sp.profilePic; if(sp.images && sp.images.length>0) currentUser.images=sp.images; } }
function savePersistentProfile(){ if(!currentUser) return; const data={id:currentUser.id, profilePic:currentUser.profilePic, images:currentUser.images||[], name:currentUser.name}; localStorage.setItem('lovenux_persistent_profile', JSON.stringify(data)); let all=JSON.parse(localStorage.getItem('lovenux_saved_profiles')||'{}'); all[currentUser.id]=data; localStorage.setItem('lovenux_saved_profiles', JSON.stringify(all)); try{ if(socket) socket.emit('updateProfilePic',{userId:currentUser.id, profilePic:currentUser.profilePic, images:currentUser.images}); }catch{} }
window.addEventListener('beforeunload', savePersistentProfile);
let users=[], filteredUsers=[], swipeIndex=0, activeTab='fooldal', activeChat=null;
let messages=JSON.parse(localStorage.getItem('lovenux_v2_msgs')||'{}');
let likes=JSON.parse(localStorage.getItem('lovenux_v2_likes')||'[]');
let likedBy=JSON.parse(localStorage.getItem('lovenux_likedBy')||'[]');
let favorites=JSON.parse(localStorage.getItem('lovenux_v2_fav')||'[]');
let notifications=JSON.parse(localStorage.getItem('lovenux_notif')||'[]');
let unreadMsgs=JSON.parse(localStorage.getItem('lovenux_unread')||'{}');
let spotlightData=[], spotlightWaiting=[], spotlightTopMale=null, spotlightTopFemale=null, spotlightDuels=[];
let socket=null;
let distanceKm=parseInt(localStorage.getItem('lovenux_distance')||'100');

function initSocket(){
 if(!currentUser) return;
 try{ socket=io(); }catch{ return; }
 socket.emit('join', currentUser.id);
 socket.on('newMessage', ({key,message})=>{
  if(!messages[key]) messages[key]=[];
  if(messages[key].some(m=>m.id===message.id)) return;
  messages[key].push(message);
  localStorage.setItem('lovenux_v2_msgs', JSON.stringify(messages));
  if(message.senderId!==currentUser.id){
   let other=message.senderId;
   unreadMsgs[other]=(unreadMsgs[other]||0)+1;
   localStorage.setItem('lovenux_unread', JSON.stringify(unreadMsgs));
  }
  render();
 });
 socket.on('likedYou', ({from})=>{ if(!likedBy.includes(from)){ likedBy.push(from); localStorage.setItem('lovenux_likedBy', JSON.stringify(likedBy)); } render(); });
 socket.on('match', ()=>{ });
 socket.on('spotlightUpdate', ()=>loadSpotlight());
}
function addNotif(text,type){
 // Értesítés csak Lovenux frissítésről - message és liked nem ide
 const allowed=['system','news','update'];
 if(!allowed.includes(type)) return;
 if(notifications[0] && notifications[0].text===text && Date.now()-notifications[0].ts<120000) return;
 notifications.unshift({id:Date.now(), ts:Date.now(), text, type, at:new Date().toLocaleTimeString()});
 if(notifications.length>30) notifications.pop();
 localStorage.setItem('lovenux_notif', JSON.stringify(notifications));
}
async function fetchUsers(){
 let serverUsers=[];
 try{ const res=await fetch('/api/users'); let data=await res.json(); if(Array.isArray(data) && data.length>0) serverUsers=data; }catch(e){ console.log('server fetch fail', e); }
 // lokális regisztrált felhasználók cache - hogy akkor is látszódjon ha szerver újraindul
 let localUsers=JSON.parse(localStorage.getItem('lovenux_local_users')||'[]');
 // merge
 let map=new Map();
 [...serverUsers, ...localUsers].forEach(u=>{ if(u && u.id) map.set(u.id, u); });
 users=Array.from(map.values());
 if(users.length===0){
  users=[
   {id:'u2', name:'Anna, 24', age:24, gender:'Nő', lookingFor:'Férfi', location:'Budapest, V.', bio:'Kávé, nevetés.', hobbies:['Utazás','Futás'], profilePic:'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&q=80', images:['https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&q=80'], relationshipStatus:'Egyedülálló', childrenStatus:'Nincs gyerek', height:168, bodyType:'Átlagos', education:'Egyetem', eye:'Kék', hair:'Szőke', job:'Marketing', isVIP:true, isOnline:true, km:12},
   {id:'u3', name:'Balázs, 27', age:27, gender:'Férfi', lookingFor:'Nő', location:'Budapest, XIII.', bio:'Bringa, edzés.', hobbies:['Edzés'], profilePic:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600&q=80', images:['https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600&q=80'], relationshipStatus:'Egyedülálló', childrenStatus:'Nincs gyerek', height:182, bodyType:'Sportos', education:'Érettségi', isVIP:true, isOnline:true, km:25},
  ];
 }
 // ha te regisztráltál 2 ellenkező neműt, azok most már users-ben vannak
 console.log('users loaded', users.length, users.map(u=>u.gender+' '+u.name));
 applyFilter();
}
function applyFilter(){
 if(!currentUser){ filteredUsers=users.filter(u=> !currentUser || u.id!==currentUser.id); return; }
 let target;
 let lf=(currentUser.lookingFor||'').toLowerCase();
 if(lf.includes('nő')) target='Nő';
 else if(lf.includes('férfi')) target='Férfi';
 else target=currentUser.gender==='Nő'?'Férfi':'Nő';
 // először szigorú km nélkül
 filteredUsers=users.filter(u=>{
  if(!u || !u.id) return false;
  if(u.id===currentUser.id) return false;
  if(target && u.gender!==target) return false;
  // km csak akkor számít ha mindkettőnek van
  if(u.km && distanceKm && u.km>distanceKm) return false;
  return true;
 });
 console.log('applyFilter target', target, 'distance', distanceKm, 'filtered', filteredUsers.length, 'from', users.length);
 if(filteredUsers.length===0){
  filteredUsers=users.filter(u=>u.id!==currentUser.id && (!target || u.gender===target));
  console.log('fallback filtered', filteredUsers.length);
  if(filteredUsers.length===0) filteredUsers=users.filter(u=>u.id!==currentUser.id);
 }
 if(swipeIndex>=filteredUsers.length) swipeIndex=0;
}
function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
async function register(fd){
 try{
  const res=await fetch('/api/register',{method:'POST', body:fd});
  const data=await res.json();
  if(data.user){
   // mentsd lokálisan is, hogy másik fiókkal belépve lásd
   let localUsers=JSON.parse(localStorage.getItem('lovenux_local_users')||'[]');
   if(!localUsers.find(u=>u.id===data.user.id)) localUsers.push(data.user);
   localStorage.setItem('lovenux_local_users', JSON.stringify(localUsers));
   currentUser=data.user; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); localStorage.setItem('lovenux_isLoggedIn','true'); savePersistentProfile(); location.reload();
  }
  else alert(data.message||'Hiba');
 }catch(e){
  // offline fallback: hozz létre lokális profilt
  console.log('register offline fallback');
  let name=document.getElementById('r_name')?.value||'Teszt';
  let gender=document.getElementById('r_gender')?.value||'Nő';
  let looking=document.getElementById('r_looking')?.value||'Férfiakat';
  let bio=document.getElementById('r_bio')?.value||'Kávé, nevetés.';
  let city=document.getElementById('r_city')?.value||'Budapest';
  let localUser={id:'local_'+Date.now(), name:name+', 24', age:24, gender:gender, lookingFor:looking, location:city, bio:bio, hobbies:['Utazás'], profilePic:window._regImages?.[0]||'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&q=80', images:window._regImages||[], relationshipStatus:'Egyedülálló', childrenStatus:'Nincs gyerek', height:170, bodyType:'Átlagos', education:'Egyetem', eye:'Kék', hair:'Szőke', job:'Marketing', isVIP:true, isOnline:true, km: Math.floor(Math.random()*50)+5};
  let localUsers=JSON.parse(localStorage.getItem('lovenux_local_users')||'[]');
  localUsers.push(localUser);
  localStorage.setItem('lovenux_local_users', JSON.stringify(localUsers));
  currentUser=localUser; localStorage.setItem('lovenux_v2_user', JSON.stringify(localUser)); localStorage.setItem('lovenux_isLoggedIn','true'); savePersistentProfile(); location.reload();
 }
}
async function loadSpotlight(){ try{ const r=await fetch('/api/spotlight'); const d=await r.json(); spotlightData=d.active||[]; spotlightWaiting=d.waiting||[]; spotlightTopMale=d.topMale; spotlightTopFemale=d.topFemale; spotlightDuels=d.duels||[]; }catch{} }

  mainInner = `<div class="p-4"><h3 class="font-bold text-[16px]">⚙️ Beállítások</h3><div class="mt-4 grid gap-3"><div class="bg-white border rounded-[12px] p-4"><div class="font-bold text-[13px]">🔞 18+ ellenőrzés</div><div class="text-[11px] opacity-60">Megerősítve • Elmúltam 18</div></div><div class="bg-white border rounded-[12px] p-4"><div class="font-bold text-[13px]">📄 ÁSZF</div><div class="text-[11px] opacity-60">Elfogadva</div></div><div class="bg-white border rounded-[12px] p-4"><div class="font-bold text-[13px]">🔏 Adatkezelés</div><div class="text-[11px] opacity-60">Elfogadva • GDPR</div></div><div class="bg-white border rounded-[12px] p-4"><div class="font-bold text-[13px]">🚫 Tiltási/jelentési alap</div><div class="flex gap-2 mt-2"><button class="px-4 h-8 rounded-full bg-red-100 text-red-600 text-[11px]">Tiltás</button><button class="px-4 h-8 rounded-full bg-black text-white text-[11px]">Jelentés</button></div></div><div class="bg-white border rounded-[12px] p-4"><div class="font-bold text-[13px]">💾 Adatok mentése a böngészőben</div><div class="text-[11px] opacity-60">${Object.keys(localStorage).length} kulcs tárolva • képek megmaradnak kijelentkezés után</div></div><div class="bg-white border rounded-[12px] p-4"><div class="font-bold text-[13px]">📏 Kilométer</div><input id="distRange3" type="range" min="5" max="200" value="${distanceKm}" class="w-full mt-2" /><div class="font-bold text-[12px]">${distanceKm} km - eddig látod a profilokat</div></div></div></div>`;
 } else if(activeTab==='messages'){
  let chatList = filteredUsers.map(u=>{ let key=[currentUser.id, u.id].sort().join('__'); let last=(messages[key]||[]).slice(-1)[0]; let unread=unreadMsgs[u.id]||0; return `<div data-chat="${u.id}" data-openchat="${u.id}" class="p-3 flex gap-3 cursor-pointer hover:bg-[#f8f7ff] border-b ${activeChat===u.id?'bg-[#f0eeff]':''}"><img src="${u.profilePic}" class="w-10 h-10 rounded-full object-cover" /><div class="flex-1 min-w-0"><div class="font-bold text-[12px] flex justify-between">${u.name} ${unread>0?`<span class="px-2 py-0.5 rounded-full bg-[#ff2e93] text-white text-[9px]">${unread} új</span>`:''}</div><div class="text-[11px] opacity-60 truncate">${last?last.text.slice(0,40):'Kezdj beszélgetést...'}</div></div></div>`}).join('') || '<div class="p-4 opacity-50 text-[11px]">Nincs felhasználó</div>';
  let activeMsgs = activeChat ? (messages[[currentUser.id, activeChat].sort().join('__')]||[]) : [];
  let msgHtml = activeChat ? activeMsgs.map(m=>`<div class="flex ${m.senderId===currentUser.id?'justify-end':'justify-start'} mb-2"><div class="msg-bubble px-3 py-2 rounded-[16px] text-[13px] ${m.senderId===currentUser.id?'bg-[#a855f7] text-white':'bg-white border shadow-sm'}">${m.text}</div></div>`).join('') : '<div class="flex-1 flex items-center justify-center opacity-40 text-[12px] p-10 text-center">Válassz beszélgetést a bal listából<br/>vagy a főoldalon nyomj Üzenet gombot</div>';
  let activeUser = activeChat ? users.find(u=>u.id===activeChat) : null;
  mainInner = `<div class="grid md:grid-cols-[320px_1fr] h-[70vh] md:h-[650px]"><div class="border-r bg-white overflow-auto"><div class="p-3 border-b font-bold text-[13px]">💬 Üzenetek • ${totalMsgs} beszélgetés ${totalUnread>0?`• ${totalUnread} új`:''}</div>${chatList}</div><div class="flex flex-col bg-[#fbf9ff]"><div class="p-3 border-b bg-white flex items-center gap-2">${activeUser?`<img src="${activeUser.profilePic}" class="w-8 h-8 rounded-full" /><span class="font-bold text-[13px]">${activeUser.name}</span>`: '<span class="text-[12px] opacity-60">Nincs kiválasztva</span>'}</div><div id="msgList" class="flex-1 overflow-auto p-3">${msgHtml}</div><div class="p-3 border-t bg-white flex gap-2"><input id="msgInput" placeholder="Írj üzenetet... (Enter)" class="flex-1 h-11 rounded-full bg-[#f5f3ff] border border-black/10 px-4 text-[13px]" /><button id="sendBtn" class="w-11 h-11 rounded-full bg-[#a855f7] text-white font-bold">➤</button></div></div></div>`;
 } else if(activeTab==='notifications'){
  mainInner = `<div class="p-4"><h3 class="font-bold text-[16px]">🔔 Értesítések • Csak Lovenux frissítések</h3><div class="mt-4 space-y-2">${notifications.map(n=>`<div class="bg-white border rounded-[12px] p-3 flex justify-between items-center"><span class="text-[12px]">${n.text}</span><span class="text-[10px] opacity-50">${n.at}</span></div>`).join('') || '<div class="bg-white border rounded-[12px] p-4"><div class="font-bold text-[13px]">💜 Lovenux frissítés</div><div class="text-[11px] opacity-60 mt-1">Rivaldafény 100 fő, 50 férfi 50 nő, szavazás, párbaj, nap férfija/nője, várakozó üzemmód él!</div><div class="text-[10px] opacity-40 mt-2">Ma • Rendszer</div></div><div class="bg-white border rounded-[12px] p-4"><div class="font-bold text-[13px]">💳 1000 Ft regisztráció</div><div class="text-[11px] opacity-60">Belül minden ingyenes, mindenki VIP</div></div>'}</div><div class="mt-4 text-[11px] opacity-50 p-3 bg-[#f8f7ff] rounded-[12px]">❤️ kedvelések a 💞 Párosítások szívben • 💬 üzenetek az Üzenetekben jelennek meg, nem itt</div></div>`;
 } else {
  mainInner = `<div class="p-6"><h3 class="font-bold text-[16px]">${activeTab}</h3><p class="opacity-60 text-[12px] mt-2">Betöltés...</p></div>`;
 }
 return `<div class="min-h-screen bg-[#f5f3ff] flex flex-col">
  <div class="love-top h-[56px] flex items-center px-3 justify-between text-white sticky top-[28px] z-[70]">
    <div class="flex items-center gap-2"><button id="mobMenu" class="md:hidden w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">☰</button><span class="font-black text-[20px]">💜</span><span class="brand font-bold">Lovenux</span></div>
    <div class="flex items-center gap-2">
      <button data-tab="parositasok" class="relative px-3 h-9 rounded-full bg-white/20 text-[11px]">❤️${totalLikes>0?`<span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-[#ff2e93] text-white text-[10px] flex items-center justify-center font-bold">${totalLikes}</span>`:''}</button>
      <button data-tab="messages" class="relative px-3 h-9 rounded-full bg-white/20 text-[11px]">💬${totalUnread>0?`<span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-[#ff2e93] text-white text-[10px] flex items-center justify-center font-bold">${totalUnread}</span>`:''} <span class="hidden md:inline">Üzenetek</span></button>
      <button data-tab="notifications" class="px-3 h-9 rounded-full bg-white/20 text-[11px]">🔔</button>
      <div class="w-8 h-8 rounded-full overflow-hidden border-2 border-white/40"><img src="${currentUser.profilePic}" class="w-full h-full object-cover" /></div>
    </div>
  </div>
  <div class="flex flex-1">
    <aside id="leftNavMain" class="left-nav hidden md:flex w-[260px] flex-col p-3 gap-1 fixed md:static inset-y-0 left-0 z-[80] pt-[80px] md:pt-3 h-screen md:h-auto overflow-auto">
      <button id="closeMenu" class="md:hidden self-end w-9 h-9 rounded-full bg-white/10 text-white mb-2">✕</button>
      ${leftNav}
    </aside>
    <div id="mobileOverlay" class="hidden fixed inset-0 bg-black/50 z-[70] md:hidden"></div>
    <main id="mainContent" class="flex-1 w-full bg-[#f5f3ff] md:p-4">
      <div class="max-w-[900px] mx-auto bg-white md:rounded-[18px] overflow-hidden shadow-sm min-h-[70vh]">
        ${mainInner}
      </div>
    </main>
  </div>
</div>`;
}
function bindMain(){
 document.getElementById('mobMenu')?.addEventListener('click', ()=>{ document.getElementById('leftNavMain').classList.remove('hidden'); document.getElementById('leftNavMain').classList.add('flex'); document.getElementById('mobileOverlay').classList.remove('hidden'); });
 document.getElementById('closeMenu')?.addEventListener('click', ()=>{ document.getElementById('leftNavMain').classList.add('hidden'); document.getElementById('mobileOverlay').classList.add('hidden'); });
 document.getElementById('mobileOverlay')?.addEventListener('click', ()=>{ document.getElementById('leftNavMain').classList.add('hidden'); document.getElementById('mobileOverlay').classList.add('hidden'); });
 document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{ activeTab=b.dataset.tab; document.getElementById('leftNavMain')?.classList.add('hidden'); document.getElementById('mobileOverlay')?.classList.add('hidden'); if(b.dataset.tab==='messages' && b.dataset.openchat){ activeChat=b.dataset.openchat; if(unreadMsgs[activeChat]){ delete unreadMsgs[activeChat]; localStorage.setItem('lovenux_unread', JSON.stringify(unreadMsgs)); } } render(); }));
 document.querySelectorAll('[data-like]').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); doLike(b.dataset.like,'like'); }));
 document.querySelectorAll('[data-super]').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); doLike(b.dataset.super,'superlike'); }));
 document.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click', ()=>{ let id=b.dataset.fav; if(!favorites.includes(id)){ favorites.push(id); localStorage.setItem('lovenux_v2_fav', JSON.stringify(favorites)); } else { favorites=favorites.filter(x=>x!==id); localStorage.setItem('lovenux_v2_fav', JSON.stringify(favorites)); } render(); }));
 document.querySelectorAll('[data-chat]').forEach(el=>el.addEventListener('click', ()=>{ activeChat=el.dataset.chat; activeTab='messages'; if(unreadMsgs[activeChat]){ delete unreadMsgs[activeChat]; localStorage.setItem('lovenux_unread', JSON.stringify(unreadMsgs)); } render(); }));
 document.querySelectorAll('[data-openchat]').forEach(el=>el.addEventListener('click', ()=>{ activeChat=el.dataset.openchat; if(unreadMsgs[activeChat]){ delete unreadMsgs[activeChat]; localStorage.setItem('lovenux_unread', JSON.stringify(unreadMsgs)); } render(); }));
 document.getElementById('btnLike')?.addEventListener('click', ()=>doLike(filteredUsers[swipeIndex]?.id,'like'));
 document.getElementById('btnNope')?.addEventListener('click', ()=>{ swipeIndex++; if(swipeIndex>=filteredUsers.length) swipeIndex=0; render(); });
 document.getElementById('btnSuper')?.addEventListener('click', ()=>doLike(filteredUsers[swipeIndex]?.id,'superlike'));
 const card=document.getElementById('swipeCard');
 if(card){
   let startX=0, startY=0, curX=0;
   const onStart=(x,y)=>{ startX=x; startY=y; card.style.transition='none'; };
   const onMove=(x,y)=>{ curX=x-startX; let rot=curX*0.05; card.style.transform=`translateX(${curX}px) rotate(${rot}deg)`; };
   const onEnd=()=>{
     card.style.transition='transform 0.3s ease';
     if(curX>80){ card.style.transform='translateX(400px) rotate(15deg)'; setTimeout(()=>{ doLike(filteredUsers[swipeIndex]?.id,'like'); },200); }
     else if(curX<-80){ card.style.transform='translateX(-400px) rotate(-15deg)'; setTimeout(()=>{ swipeIndex++; if(swipeIndex>=filteredUsers.length) swipeIndex=0; render(); },200); }
     else { card.style.transform='translateX(0) rotate(0)'; }
     curX=0;
   };
   card.addEventListener('touchstart', e=>{ onStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
   card.addEventListener('touchmove', e=>{ onMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
   card.addEventListener('touchend', onEnd);
   // mouse
   let mouseDown=false;
   card.addEventListener('mousedown', e=>{ mouseDown=true; onStart(e.clientX, e.clientY); });
   window.addEventListener('mousemove', e=>{ if(!mouseDown) return; onMove(e.clientX, e.clientY); });
   window.addEventListener('mouseup', e=>{ if(!mouseDown) return; mouseDown=false; onEnd(); });
 }
 document.getElementById('saveProfile')?.addEventListener('click', ()=>{
  currentUser.name=document.getElementById('p_name')?.value||currentUser.name;
  currentUser.age=parseInt(document.getElementById('p_age')?.value)||currentUser.age;
  currentUser.location=document.getElementById('p_loc')?.value||currentUser.location;
  currentUser.bio=document.getElementById('p_bio')?.value||currentUser.bio;
  currentUser.relationshipStatus=document.getElementById('p_rel')?.value||currentUser.relationshipStatus;
  currentUser.childrenStatus=document.getElementById('p_child')?.value||currentUser.childrenStatus;
  currentUser.height=parseInt(document.getElementById('p_height')?.value)||currentUser.height;
  currentUser.bodyType=document.getElementById('p_body')?.value||currentUser.bodyType;
  currentUser.education=document.getElementById('p_edu')?.value||currentUser.education;
  currentUser.phone=document.getElementById('p_phone')?.value||currentUser.phone;
  let dr=document.getElementById('distRange2'); if(dr) distanceKm=parseInt(dr.value);
  localStorage.setItem('lovenux_distance', distanceKm.toString());
  localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); applyFilter(); render();
 });
 document.getElementById('logout')?.addEventListener('click', ()=>{ savePersistentProfile(); localStorage.removeItem('lovenux_isLoggedIn'); currentUser=null; isLoggedIn=false; location.reload(); });
 document.getElementById('addImages')?.addEventListener('change', async e=>{
  for(let f of Array.from(e.target.files)){ let b64=await fileToBase64(f); currentUser.images.push(b64); }
  currentUser.images=currentUser.images.slice(0,8);
  if(currentUser.images[0]) currentUser.profilePic=currentUser.images[0];
  localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); render();
 });
 document.querySelectorAll('[data-delimg]').forEach(btn=>btn.addEventListener('click', ()=>{ let i=parseInt(btn.dataset.delimg); currentUser.images.splice(i,1); if(currentUser.images.length===0) currentUser.profilePic=''; else currentUser.profilePic=currentUser.images[0]; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); render(); }));
 document.getElementById('micTest')?.addEventListener('click', async ()=>{ try{ let s=await navigator.mediaDevices.getUserMedia({audio:true}); alert('Mikrofon működik'); s.getTracks().forEach(t=>t.stop()); }catch{ alert('Mikrofon nem elérhető'); } });
 document.getElementById('camTest')?.addEventListener('click', async ()=>{ try{ let s=await navigator.mediaDevices.getUserMedia({video:true}); alert('Kamera működik'); s.getTracks().forEach(t=>t.stop()); }catch{ alert('Kamera nem elérhető'); } });
 // distance sliders
 ['distRange','distRange2','distRange3'].forEach(id=>{
  document.getElementById(id)?.addEventListener('input', e=>{ distanceKm=parseInt(e.target.value); localStorage.setItem('lovenux_distance', distanceKm.toString()); });
  document.getElementById(id)?.addEventListener('change', e=>{ distanceKm=parseInt(e.target.value); localStorage.setItem('lovenux_distance', distanceKm.toString()); applyFilter(); render(); });
 });
 // news
 fetch('/api/news').then(r=>r.json()).then(news=>{
  let el=document.getElementById('newsList');
  if(el) el.innerHTML=news.map(n=>`<div class="flex gap-3 p-3 rounded-[14px] bg-white border"><img src="${n.image}" class="w-16 h-12 rounded-[8px] object-cover" /><div><div class="font-bold text-[12px]">${n.title}</div><div class="text-[10px] opacity-60 mt-1">${n.desc}</div></div></div>`).join('') || '<div class="opacity-50 text-[12px]">Nincs hír</div>';
 }).catch(()=>{});
 document.querySelectorAll('[data-vote]').forEach(b=>b.addEventListener('click', async ()=>{
  try{ const res=await fetch('/api/spotlight/vote',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({voterId:currentUser.id, targetId:b.dataset.vote})}); const data=await res.json(); if(data.success){ if(socket) socket.emit('spotlightVote',{from:currentUser.id,to:b.dataset.vote}); loadSpotlight(); setTimeout(render,400);} else alert(data.message||'Már szavaztál'); }catch{}
 }));
 document.getElementById('joinSpotlight')?.addEventListener('click', async ()=>{
  try{ const res=await fetch('/api/spotlight/join',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:currentUser.id})}); const data=await res.json(); if(data.success){ if(socket) socket.emit('spotlightJoin',{userId:currentUser.id}); loadSpotlight(); render(); } else alert(data.message||'Tele van - várakozóba kerültél'); }catch{}
 });
 const sendBtn=document.getElementById('sendBtn'); const msgInput=document.getElementById('msgInput');
 if(sendBtn && msgInput){
  let sending=false;
  const send=()=>{
   if(sending) return;
   let text=msgInput.value.trim(); if(!text) return;
   let to=activeChat||filteredUsers[0]?.id; if(!to) { alert('Válassz beszélgetést!'); sending=false; return; }
   sending=true;
   if(socket && socket.connected){ socket.emit('sendMessage',{from:currentUser.id,to,text}); }
   else {
    let key=[currentUser.id, to].sort().join('__');
    if(!messages[key]) messages[key]=[];
    let msg={id:'local_'+Date.now(), senderId:currentUser.id, text, timestamp:Date.now()};
    messages[key].push(msg); localStorage.setItem('lovenux_v2_msgs', JSON.stringify(messages));
   }
   msgInput.value='';
   setTimeout(()=>{ sending=false; render(); let ml=document.getElementById('msgList'); if(ml) ml.scrollTop=ml.scrollHeight; },100);
  };
  sendBtn.addEventListener('click', send);
  msgInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } });
  setTimeout(()=>{ let ml=document.getElementById('msgList'); if(ml) ml.scrollTop=ml.scrollHeight; },100);
 }
}
function doLike(id,type){
 // ha nincs id, próbáld a jelenlegi kártyát
 if(!id){
   let curCard = filteredUsers[swipeIndex];
   if(curCard) id=curCard.id;
 }
 if(!id){ console.log('doLike no id', swipeIndex, filteredUsers); return; }
 console.log('doLike', id, type);
 if(!likes.includes(id)){ likes.push(id); localStorage.setItem('lovenux_v2_likes', JSON.stringify(likes)); }
 try{ if(socket) socket.emit('like',{from:currentUser.id,to:id,type}); }catch{}
 swipeIndex++;
 if(swipeIndex>=filteredUsers.length){ swipeIndex=0; }
 render();
}
function checkBarion(){
 if(!currentUser) return;
 fetch('/api/barion/status/'+currentUser.id).then(r=>r.json()).then(d=>{
  if(d.enabled && !d.paid){
   if(document.getElementById('barionOverlay')) return;
   let div=document.createElement('div'); div.id='barionOverlay'; div.className='barionOverlay';
   div.innerHTML=`<div class="rounded-[24px] bg-white p-8 max-w-[360px] text-center"><div class="text-[32px]">💳</div><div class="brand text-[20px] font-bold mt-3">1000 Ft / örökre VIP</div><div class="text-[12px] opacity-70 mt-2">Belül minden ingyenes</div><button id="payBarion" class="mt-5 w-full h-12 rounded-[14px] font-bold text-white bg-gradient-to-r from-[#a855f7] to-[#ff2e93]">Fizetés Barionnal</button></div>`;
   document.body.appendChild(div);
  }
 }).catch(()=>{});
}
(async ()=>{ await fetchUsers(); await loadSpotlight(); if(currentUser) initSocket(); render(); if(!notifications.length){ addNotif('💜 Lovenux frissítés: Rivaldafény 100 fő él!','news'); } })();
</script>
</body>
