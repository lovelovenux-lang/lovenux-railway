function savePersistentProfile(){
  if(!currentUser) return;
  const data = { id: currentUser.id, profilePic: currentUser.profilePic, images: currentUser.images, name: currentUser.name, email: currentUser.email };
  localStorage.setItem('lovenux_persistent_profile', JSON.stringify(data));
  const all = JSON.parse(localStorage.getItem('lovenux_saved_profiles')||'{}');
  all[currentUser.id] = data;
  localStorage.setItem('lovenux_saved_profiles', JSON.stringify(all));
  try{ if(socket) socket.emit('updateProfilePic', { userId: currentUser.id, profilePic: currentUser.profilePic, images: currentUser.images }); }catch{}
}

function initSocket(){
 if(!currentUser) return;
 if(typeof io === 'undefined'){ console.log('socket.io not loaded in preview'); return; }
 try{ socket = io(); }catch(e){ return; }
 socket.emit('join', currentUser.id);
 socket.on('newMessage', ({key, message})=>{
  if(!messages[key]) messages[key]=[];
  messages[key].push(message);
  localStorage.setItem('lovenux_v2_msgs', JSON.stringify(messages));
  addNotif(`Új üzenet: ${message.text.slice(0,30)}...`, '💬');
  render();
 });
 socket.on('match', ({with: withId})=>{
  addNotif('💕 Új párosítás! Kezdj beszélgetést!', 'match');
  if(navigator.vibrate) navigator.vibrate(200);
 });
 socket.on('giftReceived', (g)=>{ addNotif(`🎁 Ajándékot kaptál: ${g.gift.name} ${g.gift.icon}`, 'gift'); });
 socket.on('incomingCall', ({from, type})=>{
  if(confirm(`${type==='video'?'Videó':'Hang'}hívás érkezett! Fogadod?`)){
   startCall(from, type, false);
  }
 });
}

function addNotif(text, type){

function applyFilter(){
 if(!currentUser){ filteredUsers = users; return; }
 const myGender = currentUser.gender;
 let targetGender;
 if(myGender==='Nő'){ targetGender='Férfi'; }
 else if(myGender==='Férfi'){ targetGender='Nő'; }
 else { targetGender = currentUser.lookingFor==='Nőket' ? 'Nő' : 'Férfi'; }
 filteredUsers = users.filter(u=>u.gender===targetGender && u.id!==currentUser.id && !blocks.includes(u.id));
 if(filteredUsers.length===0) filteredUsers = users.filter(u=>u.gender===targetGender && u.id!==currentUser.id);
 if(filteredUsers.length===0) filteredUsers = users.filter(u=>u.id!==currentUser.id && u.gender!==myGender);
}

function fileToBase64(file){
 return new Promise((res,rej)=>{
  const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file);
 });
}

async function handleFiles(input){
 const files = Array.from(input.files);
 const base64 = [];
 for(let f of files){ base64.push(await fileToBase64(f)); }
 return base64;
}

async function register(formData){
 const fd = new FormData();
 Object.entries(formData).forEach(([k,v])=>{
  if(k==='hobbies') fd.append(k, JSON.stringify(v));
  else if(k==='images') {}
  else fd.append(k, v);
 });

 if(window._regImages){
  window._regImages.forEach(b64=>{

   const arr = b64.split(','), mime = arr[0].match(/:(.*?);/)[1], bstr = atob(arr[1]);
   let n=bstr.length, u8=new Uint8Array(n); while(n--) u8[n]=bstr.charCodeAt(n);
   fd.append('images', new File([u8], 'photo.jpg', {type:mime}));
  });
 }
 fd.append('base64Images', JSON.stringify(window._regImages||[]));
 const res = await fetch('/api/register', { method:'POST', body: fd });
 const data = await res.json();
 if(data.user){ currentUser = data.user; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); location.reload(); }
 else alert('Hiba regisztrációnál');
}

function getActiveSpotlight(){
 const now = Date.now();

 spotlightData = spotlightData.filter(s=>s.expiresAt > now);
 localStorage.setItem('lovenux_spotlight', JSON.stringify(spotlightData));
 return spotlightData;
}

function activateSpotlight(){
 const now = Date.now();
 const active = getActiveSpotlight();
 if(active.length >= 50){
  addNotif('⚠ Rivaldafény tele van (50 fő) • próbáld később', 'spotlight');
  return;
 }

 const lastActivation = localStorage.getItem('lovenux_spotlight_last_'+currentUser.id);
 if(lastActivation && (now - parseInt(lastActivation)) < 24*60*60*1000){

 }

 const entry = { userId: currentUser.id, expiresAt: now + 60*60*1000, activatedAt: now, likes: spotlightLikes[currentUser.id]||0 };

 spotlightData = spotlightData.filter(s=>s.userId!==currentUser.id);
 spotlightData.push(entry);
 localStorage.setItem('lovenux_spotlight', JSON.stringify(spotlightData));
 localStorage.setItem('lovenux_spotlight_last_'+currentUser.id, String(now));

 if(socket) socket.emit('spotlight', {userId: currentUser.id});
 addNotif('⭐ Rivaldafény aktiválva 1 órára! Most felül körképként látszol ✓', 'spotlight');
 render();
}

function likeSpotlight(userId){
 if(!spotlightLikes[userId]) spotlightLikes[userId]=0;
 spotlightLikes[userId]++;
 localStorage.setItem('lovenux_spotlight_likes', JSON.stringify(spotlightLikes));

 spotlightData = spotlightData.map(s=> s.userId===userId ? {...s, likes: spotlightLikes[userId]} : s);
 localStorage.setItem('lovenux_spotlight', JSON.stringify(spotlightData));
 addNotif('❤ Like-oltad a rivaldafényben ✓', 'like');

 render();
}

function getTopSpotlight(){
 const active = getActiveSpotlight();
 let topMale = null, topFemale = null;
 let maxMale = -1, maxFemale = -1;
 active.forEach(s=>{
  const u = users.find(x=>x.id===s.userId) || (s.userId===currentUser.id ? currentUser : null);
  if(!u) return;
  const likes = spotlightLikes[s.userId]||s.likes||0;
  if(u.gender==='Férfi' && likes > maxMale){ maxMale=likes; topMale={...u, likes}; }
  if(u.gender==='Nő' && likes > maxFemale){ maxFemale=likes; topFemale={...u, likes}; }
 });
 return {topMale, topFemale};
}

function bindLanding(){

 const loginModal = document.getElementById('loginModal');
 const openLogin = document.getElementById('openLogin');
 const closeLogin = document.getElementById('closeLogin');
 const openRegister = document.getElementById('openRegister');
 const closeRegister = document.getElementById('closeRegister');
 const regContainer = document.getElementById('regContainer');
 const authChoice = document.getElementById('authChoice');
 const switchToRegister = document.getElementById('switchToRegister');

 if(openLogin) openLogin.addEventListener('click', ()=> loginModal.classList.remove('hidden'));
 if(closeLogin) closeLogin.addEventListener('click', ()=> loginModal.classList.add('hidden'));
 if(loginModal) loginModal.addEventListener('click', (e)=>{ if(e.target===loginModal) loginModal.classList.add('hidden'); });

 if(openRegister){
  openRegister.addEventListener('click', ()=>{
   if(regContainer){ regContainer.classList.remove('hidden'); authChoice.classList.add('hidden'); regContainer.scrollIntoView({behavior:'smooth'}); }
  });
 }
 if(closeRegister){
  closeRegister.addEventListener('click', ()=>{
   if(regContainer){ regContainer.classList.add('hidden'); authChoice.classList.remove('hidden'); }
  });
 }
 if(switchToRegister){
  switchToRegister.addEventListener('click', ()=>{
   loginModal.classList.add('hidden');
   if(regContainer){ regContainer.classList.remove('hidden'); authChoice.classList.add('hidden'); }
  });
 }

 let selectedHobbies = ['Utazás'];
 window._regImages = [];
 document.querySelectorAll('.hobby-btn').forEach(b=>{
  b.addEventListener('click', ()=>{
   const h=b.dataset.h;
   if(selectedHobbies.includes(h)) selectedHobbies=selectedHobbies.filter(x=>x!==h);
   else selectedHobbies.push(h);
   b.classList.toggle('bg-[#ff2e93]'); b.classList.toggle('border-[#ff2e93]'); b.classList.toggle('text-white');
  });
 });
 async function handleFileList(files){
  for(let f of files){
   const b64 = await fileToBase64(f);
   window._regImages.push(b64);
  }
  window._regImages = window._regImages.slice(0,8);
  const prev = document.getElementById('r_preview');
  prev.innerHTML = window._regImages.map((img,i)=>`<div class="relative group"><img src="${img}" class="w-full h-[64px] rounded-[12px] object-cover border border-white/10" /><button data-i="${i}" class="del-img absolute -top-1 -right-1 w-5 h-5 rounded-full bg-black text-white text-[10px]">✕</button>${i===0?'<span class="absolute bottom-1 left-1 text-[8px] px-1 rounded bg-[#ff2e93] text-white">FŐ</span>':''}</div>`).join('');
  prev.querySelectorAll('.del-img').forEach(btn=>btn.addEventListener('click', ()=>{ window._regImages.splice(parseInt(btn.dataset.i),1); handleFileList([]); }));
 }
 document.getElementById('r_files').addEventListener('change', e=>handleFileList(Array.from(e.target.files)));
 document.getElementById('r_camera').addEventListener('change', e=>handleFileList(Array.from(e.target.files)));

 const showLoginErr = (msg)=>{
  let el=document.getElementById('r_err');
  if(el){ el.textContent=msg; el.classList.remove('hidden'); setTimeout(()=>el.classList.add('hidden'), 3000); }
  else alert(msg);
 };

 document.getElementById('loginGoogle')?.addEventListener('click', async ()=>{ if(true){ alert('Csak igazi regisztrációval lehet belépni - Google belépés kikapcsolva'); return; }
  const mockUser = { id:'google_'+Date.now(), name:'Google User, 26', age:26, gender:'Nő', lookingFor:'Férfi', location:'Budapest', bio:'Google belépés', hobbies:['Utazás'], profilePic:'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=600', images:['https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=600'], relationshipStatus:'Egyedülálló', childrenStatus:'Nincs gyerek', height:168, bodyType:'Átlagos', education:'Egyetem', isVIP:true, isOnline:true, lastActive:'most', phone:'+3630', email:'google@lovenux.hu' };
  currentUser = mockUser; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); location.reload();
 });
 document.getElementById('loginFacebook')?.addEventListener('click', async ()=>{ if(true){ alert('Csak igazi regisztrációval lehet belépni - Facebook belépés kikapcsolva'); return; }
  const mockUser = { id:'fb_'+Date.now(), name:'Facebook User, 27', age:27, gender:'Férfi', lookingFor:'Nő', location:'Budapest', bio:'Facebook belépés', hobbies:['Gaming'], profilePic:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600', images:['https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600'], relationshipStatus:'Egyedülálló', childrenStatus:'Nincs gyerek', height:182, bodyType:'Sportos', education:'Érettségi', isVIP:true, isOnline:true, lastActive:'most', phone:'+3630', email:'fb@lovenux.hu' };
  currentUser = mockUser; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); location.reload();
 });
 document.getElementById('loginApple')?.addEventListener('click', async ()=>{ if(true){ alert('Csak igazi regisztrációval lehet belépni - Apple belépés kikapcsolva'); return; }
  const mockUser = { id:'apple_'+Date.now(), name:'Apple User, 25', age:25, gender:'Nő', lookingFor:'Férfiakat', location:'Budapest', bio:'Apple belépés', hobbies:['Zene'], profilePic:'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600', images:['https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600'], relationshipStatus:'Egyedülálló', childrenStatus:'Nincs gyerek', height:170, bodyType:'Átlagos', education:'Főiskola / Egyetem', isVIP:true, isOnline:true, lastActive:'most', phone:'+3630', email:'apple@lovenux.hu' };
  currentUser = mockUser; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); location.reload();
 });

 document.getElementById('l_submit')?.addEventListener('click', async ()=>{
  const email = document.getElementById('l_email').value.trim();
  const pass = document.getElementById('l_pass').value.trim();
  if(!email || !pass) return showLoginErr('Add meg az emailt és jelszót');

  try{
   const res = await fetch('/api/users', { headers:{ 'x-auth':'vip' }});
   const all = await res.json();
   let found = all.find(u=>"" && "".toLowerCase()===email.toLowerCase());
   if(found){
    currentUser = found; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); location.reload(); return;
   }
  }catch{}

  const local = JSON.parse(localStorage.getItem('lovenux_v2_user')||'null');
  if(local && local.email && local.email.toLowerCase()===email.toLowerCase()){
   currentUser = local; location.reload(); return;
  }

  const savedProfiles = JSON.parse(localStorage.getItem('lovenux_saved_profiles')||'{}');
  const saved = Object.values(savedProfiles).find(sp=> sp.name && sp.name.toLowerCase().includes(email.split('@')[0].toLowerCase()));

  const mockUser = { id:'email_'+Date.now(), name: email.split('@')[0]+', 24', age:24, gender:'Nő', lookingFor:'Férfi', location:'Budapest', bio:'Email belépés', hobbies:['Utazás'], profilePic: (saved && saved.profilePic) ? saved.profilePic : 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600', images: (saved && saved.images) ? saved.images : ['https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600'], relationshipStatus:'Egyedülálló', childrenStatus:'Nincs gyerek', height:168, bodyType:'Átlagos', education:'Érettségi', isVIP:true, isOnline:true, lastActive:'most', phone:'+3630', email };
  currentUser = mockUser; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); location.reload();
 });

 document.getElementById('forgotPass')?.addEventListener('click', ()=>{ const e=prompt('Add meg az email címed a jelszó visszaállításhoz:'); if(e) alert('📧 Jelszó visszaállító link elküldve: '+e+' (mock)'); });

 document.getElementById('l_phone_btn')?.addEventListener('click', ()=>{
  const phone = document.getElementById('l_phone').value.trim();
  if(!phone) return showLoginErr('Add meg a telefonszámot');
  document.getElementById('otpBox').classList.remove('hidden');
  const code = Math.floor(100000+Math.random()*900000);
  window._otpCode = String(code);
  alert('📱 OTP kód (mock): '+code+' → Telefonszám: '+phone);
 });
 document.getElementById('l_otp_btn')?.addEventListener('click', ()=>{
  const input = document.getElementById('l_otp').value.trim();
  if(input===window._otpCode){
   const phone = document.getElementById('l_phone').value.trim();
   const mockUser = { id:'phone_'+Date.now(), name:'Mobil User, 26', age:26, gender:'Férfi', lookingFor:'Nőket', location:'Budapest', bio:'Telefon belépés', hobbies:['Edzés'], profilePic:'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=600', images:['https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=600'], relationshipStatus:'Egyedülálló', childrenStatus:'Nincs gyerek', height:182, bodyType:'Sportos', education:'Érettségi', isVIP:true, isOnline:true, lastActive:'most', phone, email: phone+'@lovenux.hu' };
   currentUser = mockUser; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); location.reload();
  }else alert('❌ Hibás OTP kód');
 });

 document.getElementById('r_submit').addEventListener('click', ()=>{
  const get = id=>document.getElementById(id).value;
  const errEl = document.getElementById('r_err');
  const showErr = t=>{ errEl.textContent=t; errEl.classList.remove('hidden'); };
  if(!get('r_email')||!get('r_name')) return showErr('Email és név kötelező');
  if(window._regImages.length===0) return showErr('Tölts fel legalább 1 profilképet telefonról/galériából/kamerával');
  if(!document.getElementById('c18').checked) return showErr('El kell fogadnod: elmúltál 18');
  if(!document.getElementById('caszf').checked) return showErr('El kell fogadnod az ÁSZF-et');
  if(!document.getElementById('cadat').checked) return showErr('El kell fogadnod az adatkezelést');

  const lookingMap = { 'Nőket':'Nő', 'Férfiakat':'Férfi', 'Mindkettő':'Mindkettő' };
  const looking = lookingMap[get('r_looking')] || get('r_looking');

  register({
   email:get('r_email'), password:document.getElementById('r_pass').value, name:get('r_name'), age:get('r_age'),
   gender:get('r_gender'), lookingFor:looking, location:get('r_city'), phone:get('r_phone'), bio:get('r_bio'),
   relationshipStatus:get('r_rel'), childrenStatus:get('r_child'), height:get('r_height'), bodyType:get('r_body'), education:get('r_edu'),
   hobbies:selectedHobbies
  });
 });
}

function bindMain(){

 document.querySelectorAll('.call-btn, [data-call]').forEach(b=>b.addEventListener('click', ()=>{ const to=b.dataset.call||b.dataset.id; const type=b.dataset.type||'voice'; startCall(to,type,true); }));

 const btnLike = document.getElementById('btnLike'); if(btnLike) btnLike.addEventListener('click', ()=>doLike(filteredUsers[swipeIndex]?.id,'like'));

 const card = document.getElementById('swipeCard');
 if(card){
  let startX=0, isDrag=false;
  const onDown = e=>{ isDrag=true; startX=e.clientX||e.touches?.[0]?.clientX||e.clientX; card.style.transition='none'; };
  const onMove = e=>{
   if(!isDrag) return;
   const clientX = e.clientX||e.touches?.[0]?.clientX||0;
   const x = clientX-startX;
   dragX=x; card.style.transform=`translateX(${x}px) rotate(${x*0.08}deg)`;
   const likeEl=document.getElementById('likeStamp'), nopeEl=document.getElementById('nopeStamp');
   if(likeEl){ likeEl.style.opacity = x>20?Math.min(1, x/80):'0'; likeEl.style.transform = `rotate(-12deg) scale(${1 + Math.min(0.2, x/300)})`; }
   if(nopeEl){ nopeEl.style.opacity = x<-20?Math.min(1, Math.abs(x)/80):'0'; nopeEl.style.transform = `rotate(12deg) scale(${1 + Math.min(0.2, Math.abs(x)/300)})`; }
  };
  const onUp = e=>{
   if(!isDrag) return; isDrag=false; card.style.transition='transform 0.35s cubic-bezier(0.2,0.8,0.2,1)';
   const clientX = e.clientX||e.changedTouches?.[0]?.clientX||startX;
   const x = clientX-startX;

   if(x>80){ 
    doLike(filteredUsers[swipeIndex]?.id, 'like'); 
    addNotif('👉 Jobbra húztad • IGEN ❤ ✓','swipe');
    card.style.transform='translateX(500px) rotate(20deg)'; setTimeout(()=>{ dragX=0; render(); }, 250); return;
   } 
   if(x<-80){ 
    doLike(filteredUsers[swipeIndex]?.id, 'nope'); 
    addNotif('👈 Balra húztad • NEM ✕ ✓','swipe');
    card.style.transform='translateX(-500px) rotate(-20deg)'; setTimeout(()=>{ swipeIndex++; dragX=0; render(); }, 250); return;
   }
   dragX=0; card.style.transform='translateX(0) rotate(0)'; const l=document.getElementById('likeStamp'), n=document.getElementById('nopeStamp'); if(l) l.style.opacity='0'; if(n) n.style.opacity='0';
  };
  card.addEventListener('pointerdown', onDown); window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp);
  card.addEventListener('touchstart', onDown, {passive:true}); window.addEventListener('touchmove', onMove, {passive:true}); window.addEventListener('touchend', onUp);
 }

 if(activeTab==='discover'){
  const keyHandler = (e)=>{
   if(e.key==='ArrowRight'){ doLike(filteredUsers[swipeIndex]?.id,'like'); }
   if(e.key==='ArrowLeft'){ swipeIndex++; render(); }

  window.addEventListener('keydown', keyHandler, {once:true});
  document.getElementById('bottomLike')?.addEventListener('click', ()=>{ doLike(filteredUsers[swipeIndex]?.id,'like'); });
  document.querySelectorAll('[data-action="message"]').forEach(b=>b.addEventListener('click', ()=>{ const id=b.dataset.id; if(id){ activeChat=id; activeTab='messages'; render(); } }));

 const sendBtn = document.getElementById('sendBtn');
 const msgInput = document.getElementById('msgInput');
 if(sendBtn && msgInput){
  const send = ()=>{
   const text = msgInput.value.trim(); if(!text||!activeChat) return;
   const key=[currentUser.id, activeChat].sort().join('__');
   if(!messages[key]) messages[key]=[];
   const msg={id:Date.now(), senderId:currentUser.id, text, timestamp:Date.now()};
   messages[key].push(msg);
   localStorage.setItem('lovenux_v2_msgs', JSON.stringify(messages));
   if(socket) socket.emit('sendMessage',{from:currentUser.id,to:activeChat,text});
   msgInput.value=''; render();
   setTimeout(()=>{ const list=document.getElementById('msgList'); if(list) list.scrollTop=list.scrollHeight; },100);
  };
  sendBtn.addEventListener('click', send);
  msgInput.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
 }

 if(saveBtn){

   currentUser.education = document.getElementById('p_edu').value;

  });
 }

  const logout = document.getElementById('logout'); if(logout) logout.addEventListener('click', ()=>{

   const savedProfiles = JSON.parse(localStorage.getItem('lovenux_saved_profiles')||'{}');
   savedProfiles[currentUser.id] = { profilePic: currentUser.profilePic, images: currentUser.images, name: currentUser.name, email: currentUser.email };
   localStorage.setItem('lovenux_saved_profiles', JSON.stringify(savedProfiles));
   localStorage.setItem('lovenux_persistent_profile', JSON.stringify({ id: currentUser.id, profilePic: currentUser.profilePic, images: currentUser.images, name: currentUser.name, email: currentUser.email }));
  }
  localStorage.removeItem('lovenux_v2_user');
  localStorage.removeItem('lovenux_v2_msgs');
  location.reload();
 });

 const changeAvatar = document.getElementById('changeAvatar');
 if(changeAvatar) changeAvatar.addEventListener('change', async e=>{
  const f = e.target.files[0]; if(!f) return;
  const b64 = await fileToBase64(f);
  currentUser.profilePic = b64; currentUser.images[0]=b64;
  localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); render();
 });
 const addImages = document.getElementById('addImages');
 if(addImages) addImages.addEventListener('change', async e=>{
  for(let f of Array.from(e.target.files)){
   const b64 = await fileToBase64(f);
   currentUser.images.push(b64);
  }
  currentUser.images = currentUser.images.slice(0,8);
  localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); render();
 });
 document.querySelectorAll('[data-delimg]').forEach(btn=>btn.addEventListener('click', ()=>{
  const i=parseInt(btn.dataset.delimg); currentUser.images.splice(i,1); if(currentUser.images.length===0) currentUser.profilePic=''; else currentUser.profilePic=currentUser.images[0];
  localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); render();
 }));

 if(activeTab==='news'){
  fetch('/api/news').then(r=>r.json()).then(news=>{
   const el=document.getElementById('newsList');
   if(el) el.innerHTML = news.map(n=>`<div class="rounded-[20px] overflow-hidden glass"><img src="${n.image}" class="w-full h-[180px] object-cover" /><div class="p-4"><div class="font-bold">${n.title}</div><div class="text-[12px] opacity-70 mt-1">${n.desc}</div></div></div>`).join('');
  });
 }

 const spotBtn = document.getElementById('activateSpotlight');
 if(spotBtn) spotBtn.addEventListener('click', ()=>{ activateSpotlight(); });
 document.querySelectorAll('[data-like-spotlight]').forEach(btn=>{
  btn.addEventListener('click', (e)=>{
   e.stopPropagation();
   const id = btn.dataset.likeSpotlight;
   likeSpotlight(id);
  });
 });

 if(activeTab==='discover'){
  const handleKey = (e)=>{
   if(e.key==='ArrowRight'){ doLike(filteredUsers[swipeIndex]?.id, 'like'); }
   if(e.key==='ArrowLeft'){ swipeIndex++; render(); }
  };
  window.addEventListener('keydown', handleKey, {once:true});
 }
}

function doLike(id,type){
 if(!id) return;
 if(type==='nope'){ swipeIndex++; render(); return; }
 if(!likes.includes(id)){ likes.push(id); localStorage.setItem('lovenux_v2_likes', JSON.stringify(likes)); }
 if(socket) socket.emit('like',{from:currentUser.id,to:id,type});
 if(type==='like') addNotif('❤ Tetszik elküldve', 'like');
 if(type==='superlike') addNotif('⭐ Szuperlájk elküldve! Kiemelt', 'superlike');

 if(Math.random()>0.35){
  addNotif('💕 Párosítás! Te és valaki kedvelitek egymást', 'match');
  if(navigator.vibrate) navigator.vibrate([100,50,100]);
 }
 swipeIndex++; render();
}

function toggleFav(id){
 if(favorites.includes(id)){ favorites=favorites.filter(x=>x!==id); }
 else{ favorites.push(id); addNotif('❤ Kedvencekhez adva', 'fav'); }
 localStorage.setItem('lovenux_v2_fav', JSON.stringify(favorites)); render();
}

function openGiftModal(to){
 const gift = prompt(`🎁 Válassz ajándékot (írd be: ${GIFTS.map(g=>g.icon+' '+g.name).join(', ')}):\nPl: 🌹`);
 if(!gift) return;
 const found = GIFTS.find(g=>gift.includes(g.icon)||gift.toLowerCase().includes(g.name.toLowerCase())) || {icon:'🎁',name:gift};
 if(socket) socket.emit('gift',{from:currentUser.id,to,gift:found});
 addNotif(`🎁 Ajándék elküldve: ${found.icon} ${found.name} • ingyenes VIP`, 'gift');
}

let pc=null, localStream=null;
async function startCall(to, type, isCaller){
 const modal=document.getElementById('callModal');
 const callImg=document.getElementById('callImg');
 const callName=document.getElementById('callName');
 const callStatus=document.getElementById('callStatus');
 const user = users.find(u=>u.id===to);
 if(user){ callImg.src=user.profilePic; callName.textContent=user.name; }
 callStatus.textContent = type==='video'?'🎥 Videóhívás...':'📞 Hanghívás...';
 modal.classList.remove('hidden');

 try{
  pc = new RTCPeerConnection({ iceServers:[{urls:'stun:stun.l.google.com:19302'}] });
  localStream = await navigator.mediaDevices.getUserMedia({ video:type==='video', audio:true });
  document.getElementById('localVideo').srcObject=localStream;
  document.getElementById('localVideo').classList.remove('hidden');
  localStream.getTracks().forEach(track=>pc.addTrack(track, localStream));
  pc.ontrack = e=>{ document.getElementById('remoteVideo').srcObject=e.streams[0]; document.getElementById('remoteVideo').classList.remove('hidden'); };
  pc.onicecandidate = e=>{ if(e.candidate && socket) socket.emit('iceCandidate',{from:currentUser.id,to, candidate:e.candidate}); };
  if(isCaller){
   const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
   socket.emit('call',{from:currentUser.id,to,offer,type});
  }
  socket.on('callAnswered', async ({answer})=>{ await pc.setRemoteDescription(answer); callStatus.textContent='✅ Kapcsolódva'; });
  socket.on('iceCandidate', async ({candidate})=>{ try{ await pc.addIceCandidate(candidate); }catch{} });
  socket.on('incomingCall', async ({from, offer})=>{
   if(from!==to) return;
   await pc.setRemoteDescription(offer);
   const answer = await pc.createAnswer(); await pc.setLocalDescription(answer);
   socket.emit('callAnswer',{from:currentUser.id,to:from,answer});
   callStatus.textContent='✅ Kapcsolódva';
  });
 }catch(err){ callStatus.textContent='❌ Nem sikerült: '+err.message; }

 document.getElementById('endCall').onclick = ()=>{ 
  if(pc) pc.close(); if(localStream) localStream.getTracks().forEach(t=>t.stop());
  modal.classList.add('hidden'); pc=null;
 };
}
