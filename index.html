<body class="bg-[#08080a] text-[#f5f5f7] antialiased">
<div class="w-full bg-gradient-to-r from-[#ff2e93] to-[#ff8a5b] text-white text-center text-[11px] md:text-[12px] font-black tracking-widest py-2.5 sticky top-0 z-[100]">REGISZTRÁLJ EGYSZER 1000FT-ÉRT ÖRÖKRE HOGY ÖRÖKRE VIP TAG LEHESS!!</div>
<div id="app"></div>
<script>
const REL=['Egyedülálló','Kapcsolatban','Bonyolult','Házas de nem működik','Elvált','Özvegy','Nyitott kapcsolatra'];
const CHILD=['Nincs gyerek','Van gyerek - nálam','Van gyerek - nem nálam','Szeretnék gyereket','Nem szeretnék gyereket','Majd később'];
const BODY=['Vékony','Átlagos','Sportos','Izmos','Telt','Molett'];
const EDU=['Általános iskola','Szakmunkás','Érettségi','Főiskola / Egyetem','Mester / Doktori'];
const HOBBIES=['Utazás','Gasztro','Zene','Mozi','Edzés','Túrázás','Olvasás','Gaming','Fotózás','Főzés','Tánc','Könyv','Természet','Állatok','Művészet','Bor','Kávé','Jóga'];
const GIFTS=[{icon:'🌹',name:'Rózsa'},{icon:'🍫',name:'Csoki'},{icon:'💎',name:'Gyémánt'},{icon:'🧸',name:'Maci'},{icon:'💋',name:'Puszi'},{icon:'🥂',name:'Pezsgő'}];

let currentUser=JSON.parse(localStorage.getItem('lovenux_v2_user')||'null');
let savedProfiles=JSON.parse(localStorage.getItem('lovenux_saved_profiles')||'{}');
if(currentUser && savedProfiles[currentUser.id]){
 let sp=savedProfiles[currentUser.id];
 if(sp.profilePic) currentUser.profilePic=sp.profilePic;
 if(sp.images && sp.images.length>0) currentUser.images=sp.images;
}
function savePersistentProfile(){
 if(!currentUser) return;
 const data={id:currentUser.id, profilePic:currentUser.profilePic, images:currentUser.images, name:currentUser.name};
 localStorage.setItem('lovenux_persistent_profile', JSON.stringify(data));
 let all=JSON.parse(localStorage.getItem('lovenux_saved_profiles')||'{}');
 all[currentUser.id]=data; localStorage.setItem('lovenux_saved_profiles', JSON.stringify(all));
 try{ if(socket) socket.emit('updateProfilePic',{userId:currentUser.id, profilePic:currentUser.profilePic, images:currentUser.images}); }catch{}
}
window.addEventListener('beforeunload', savePersistentProfile);
window.addEventListener('pagehide', savePersistentProfile);

let users=[], filteredUsers=[], swipeIndex=0, dragX=0, activeTab='nearby', activeChat=null;
let messages=JSON.parse(localStorage.getItem('lovenux_v2_msgs')||'{}');
let likes=JSON.parse(localStorage.getItem('lovenux_v2_likes')||'[]');
let likedBy=JSON.parse(localStorage.getItem('lovenux_likedBy')||'[]');
let favorites=JSON.parse(localStorage.getItem('lovenux_v2_fav')||'[]');
let blocks=JSON.parse(localStorage.getItem('lovenux_v2_blocks')||'[]');
let notifications=JSON.parse(localStorage.getItem('lovenux_notif')||'[]');
let spotlightData=[], spotlightWaiting=[], spotlightTopMale=null, spotlightTopFemale=null, spotlightDuels=[];
let socket=null;

function initSocket(){
 if(!currentUser) return;
 try{ socket=io(); }catch{ return; }
 socket.emit('join', currentUser.id);
 socket.on('newMessage', ({key,message})=>{
  if(!messages[key]) messages[key]=[];
  if(messages[key].some(m=>m.id===message.id)) return;
  messages[key].push(message);
  localStorage.setItem('lovenux_v2_msgs', JSON.stringify(messages));
  if(message.senderId!==currentUser.id) addNotif('💬 Új üzenet','message');
  render();
 });
 socket.on('likedYou', ({from})=>{
  if(!likedBy.includes(from)){ likedBy.push(from); localStorage.setItem('lovenux_likedBy', JSON.stringify(likedBy)); }
  addNotif('❤ Kedvelés érkezett','likedYou');
 });
 socket.on('match', ()=>{ addNotif('💕 Új randi!!','match'); });
 socket.on('giftReceived', g=>{ addNotif('🎁 '+g.gift.icon+' '+g.gift.name,'gift'); });
 socket.on('incomingCall', d=>{ addNotif((d.type==='video'?'🎥':'📞')+' Hívás','call'); });
 socket.on('spotlightUpdate', ()=>loadSpotlight());
 socket.on('spotlightVote', ()=>loadSpotlight());
}
function addNotif(text,type){
 const allowed=['match','message','gift','call','likedYou'];
 if(!allowed.includes(type)) return;
 if(notifications[0] && notifications[0].text===text && Date.now()-notifications[0].ts<120000) return;
 notifications.unshift({id:Date.now(), ts:Date.now(), text, type, at:new Date().toLocaleTimeString()});
 if(notifications.length>30) notifications.pop();
 localStorage.setItem('lovenux_notif', JSON.stringify(notifications));
}
async function fetchUsers(){
 try{ const res=await fetch('/api/users'); users=await res.json(); }catch{
  users=[
   {id:'u2', name:'Anna, 24', age:24, gender:'Nő', lookingFor:'Férfi', location:'Budapest, V.', bio:'Kávé, nevetés.', hobbies:['Utazás'], profilePic:'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&q=80', images:['https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&q=80'], relationshipStatus:'Egyedülálló', childrenStatus:'Nincs gyerek', height:168, bodyType:'Átlagos', education:'Egyetem', isVIP:true, isOnline:true, lastActive:'most'},
   {id:'u3', name:'Balázs, 27', age:27, gender:'Férfi', lookingFor:'Nő', location:'Budapest, XIII.', bio:'Bringa, edzés.', hobbies:['Edzés'], profilePic:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600&q=80', images:['https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600&q=80'], relationshipStatus:'Egyedülálló', childrenStatus:'Nincs gyerek', height:182, bodyType:'Sportos', education:'Érettségi', isVIP:true, isOnline:true, lastActive:'2p'},
  ];
 }
 applyFilter();
}
function applyFilter(){
 if(!currentUser){ filteredUsers=users; return; }
 let target;
 if(currentUser.lookingFor==='Nő' || currentUser.lookingFor==='Nőket') target='Nő';
 else if(currentUser.lookingFor==='Férfi' || currentUser.lookingFor==='Férfiakat') target='Férfi';
 else target=currentUser.gender==='Nő'?'Férfi':'Nő';
 filteredUsers=users.filter(u=>u.gender===target && u.id!==currentUser.id && !blocks.includes(u.id));
 if(filteredUsers.length===0) filteredUsers=users.filter(u=>u.id!==currentUser.id);
}
function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
async function register(fd){
 try{
  const res=await fetch('/api/register',{method:'POST', body:fd});
  const data=await res.json();
  if(data.user){ currentUser=data.user; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); location.reload(); }
  else alert(data.message||'Hiba');
 }catch(e){ alert('Hiba: '+e.message); }
}
async function loadSpotlight(){
 try{ const r=await fetch('/api/spotlight'); const d=await r.json(); spotlightData=d.active||[]; spotlightWaiting=d.waiting||[]; spotlightTopMale=d.topMale; spotlightTopFemale=d.topFemale; spotlightDuels=d.duels||[]; if(activeTab==='spotlight') render(); }catch{}
}
function render(){ const root=document.getElementById('app'); if(!currentUser){ root.innerHTML=renderLanding(); bindLanding(); return; } root.innerHTML=renderMain(); bindMain(); checkBarion(); }
function renderLanding(){
 return `<div class="min-h-screen bg-[#08080a] relative overflow-hidden flex flex-col">
  <div class="absolute -top-[300px] -right-[300px] w-[800px] h-[800px] rounded-full blur-[120px] opacity-40" style="background:radial-gradient(circle, #ff2e93 0%, #ff8a5b 40%, transparent 70%)"></div>
  <header class="relative z-10 max-w-[1280px] mx-auto w-full px-6 h-[72px] flex items-center"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-[14px] badge-vip flex items-center justify-center font-black text-white text-[22px]">L</div><span class="brand text-[22px] font-bold">Lovenux</span></div></header>
  <div class="relative z-10 flex-1 flex items-center justify-center px-6 py-8">

    <div id="authChoice" class="rounded-[28px] glass p-8 shadow-[0_40px_100px_rgba(0,0,0,0.6)] text-center">
     <div class="w-16 h-16 rounded-[20px] badge-vip mx-auto flex items-center justify-center text-[32px] font-black text-white">L</div>
     <h1 class="brand text-[28px] font-[800] mt-5">Lovenux</h1>
     <div class="mt-8 grid gap-3">
      <button id="openLogin" class="h-[54px] rounded-[16px] bg-white text-black font-bold text-[15px]">Belépés</button>
      <button id="openRegister" class="h-[54px] rounded-[16px] font-bold text-[15px] text-white" style="background:linear-gradient(90deg,#ff2e93,#ff6b9d)">Regisztráció</button>
     </div>
    </div>
    <div id="regContainer" class="hidden rounded-[28px] glass p-6 mt-4">
     <div class="flex items-center justify-between"><h2 class="brand text-[20px] font-bold">Regisztráció</h2><button id="closeRegister" class="w-9 h-9 rounded-full bg-white/10">✕</button></div>
     <div class="mt-6 grid gap-3">
      <div class="grid grid-cols-2 gap-3">
       <div><label class="text-[11px] opacity-60">Email</label><input id="r_email" class="mt-1 w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]" /></div>
       <div><label class="text-[11px] opacity-60">Jelszó</label><input id="r_pass" type="password" class="mt-1 w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]" /></div>
      </div>
      <div class="grid grid-cols-[1fr_90px] gap-3">
       <div><label class="text-[11px] opacity-60">Név</label><input id="r_name" class="mt-1 w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]" /></div>
       <div><label class="text-[11px] opacity-60">Kor</label><input id="r_age" type="number" value="24" class="mt-1 w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]" /></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
       <div><label class="text-[11px] opacity-60">Nemed</label><select id="r_gender" class="mt-1 w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]"><option>Nő</option><option>Férfi</option></select></div>
       <div><label class="text-[11px] opacity-60">Kit keresel</label><select id="r_looking" class="mt-1 w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]"><option>Nőket</option><option>Férfiakat</option><option>Mindkettő</option></select></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
       <div><label class="text-[11px] opacity-60">Város</label><input id="r_city" value="Budapest" class="mt-1 w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]" /></div>
       <div><label class="text-[11px] opacity-60">Telefon privát</label><input id="r_phone" placeholder="+36..." class="mt-1 w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]" /></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
       <div><label class="text-[11px] opacity-60">Családi állapot</label><select id="r_rel" class="mt-1 w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]">${REL.map(o=>`<option>${o}</option>`).join('')}</select></div>
       <div><label class="text-[11px] opacity-60">Gyerekstátusz</label><select id="r_child" class="mt-1 w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]">${CHILD.map(o=>`<option>${o}</option>`).join('')}</select></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
       <div><label class="text-[11px] opacity-60">Magasság cm</label><input id="r_height" type="number" value="170" class="mt-1 w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]" /></div>
       <div><label class="text-[11px] opacity-60">Testalkat</label><select id="r_body" class="mt-1 w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]">${BODY.map(o=>`<option>${o}</option>`).join('')}</select></div>
      </div>
      <div><label class="text-[11px] opacity-60">Iskolai végzettség</label><select id="r_edu" class="mt-1 w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]">${EDU.map(o=>`<option>${o}</option>`).join('')}</select></div>
      <div><label class="text-[11px] opacity-60">Bemutatkozás</label><textarea id="r_bio" rows="2" class="mt-1 w-full rounded-[14px] bg-[#0f0f12] border border-white/10 p-3 text-[13px]"></textarea></div>
      <div><label class="text-[11px] opacity-60">Hobbi</label><div class="mt-2 flex flex-wrap gap-2">${HOBBIES.map(h=>`<button type="button" data-h="${h}" class="hobby-btn px-3 py-1.5 rounded-full text-[11px] border bg-[#0f0f12] border-white/10">${h}</button>`).join('')}</div></div>
      <div class="rounded-[16px] bg-[#0f0f12] border border-white/10 p-4">
       <div class="font-bold text-[12px]">Galéria • 📷 telefonos képválasztás • 📸 kamera</div>
       <div class="mt-3 flex gap-2">
        <label class="flex-1 h-11 rounded-[12px] bg-white text-black font-bold text-[12px] flex items-center justify-center cursor-pointer">🖼️ Galéria<input type="file" id="r_files" accept="image/*" multiple class="hidden" /></label>
        <label class="flex-1 h-11 rounded-[12px] bg-[#1e1e24] border border-white/10 font-bold text-[12px] flex items-center justify-center cursor-pointer">📸 Kamera<input type="file" id="r_camera" accept="image/*" capture="user" class="hidden" /></label>

      </div>

       <label class="flex gap-3"><input id="c18" type="checkbox" /><span class="text-[12px]">🔞 Elmúltam 18 éves</span></label>
       <label class="flex gap-3"><input id="caszf" type="checkbox" /><span class="text-[12px]">📄 Elfogadom az ÁSZF-et</span></label>
       <label class="flex gap-3"><input id="cadat" type="checkbox" /><span class="text-[12px]">🔏 Elfogadom az Adatkezelést</span></label>
      </div>

      <button id="r_submit" class="h-[48px] rounded-[14px] font-bold text-[14px] text-white" style="background:linear-gradient(90deg,#ff2e93,#ff6b9d)">Regisztráció • 1000 Ft örökre VIP</button>
     </div>
    </div>
   </div>
  </div>
  <div id="loginModal" class="hidden fixed inset-0 z-[200] bg-black/80 backdrop-blur-[16px] flex items-center justify-center p-4">
   <div class="w-full max-w-[420px] rounded-[28px] glass p-7">
    <div class="flex items-center justify-between"><h2 class="brand text-[22px] font-bold">Belépés</h2><button id="closeLogin" class="w-9 h-9 rounded-full bg-white/10">✕</button></div>
    <div class="mt-6 grid gap-2">
     <input id="l_email" placeholder="Email" class="w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]" />
     <input id="l_pass" type="password" placeholder="Jelszó" class="w-full h-11 rounded-[14px] bg-[#0f0f12] border border-white/10 px-3 text-[13px]" />
     <button id="l_submit" class="h-[46px] rounded-[14px] font-bold text-white" style="background:linear-gradient(90deg,#ff2e93,#ff6b9d)">Belépés</button>
    </div>
   </div>
  </div>
 </div>`;
}
function bindLanding(){
 const loginModal=document.getElementById('loginModal');
 const openLogin=document.getElementById('openLogin');
 const closeLogin=document.getElementById('closeLogin');
 const openRegister=document.getElementById('openRegister');
 const closeRegister=document.getElementById('closeRegister');
 const regContainer=document.getElementById('regContainer');
 const authChoice=document.getElementById('authChoice');
 if(openLogin) openLogin.onclick=()=>loginModal.classList.remove('hidden');
 if(closeLogin) closeLogin.onclick=()=>loginModal.classList.add('hidden');
 if(loginModal) loginModal.onclick=(e)=>{ if(e.target===loginModal) loginModal.classList.add('hidden'); };
 if(openRegister) openRegister.onclick=()=>{ regContainer.classList.remove('hidden'); authChoice.classList.add('hidden'); };
 if(closeRegister) closeRegister.onclick=()=>{ regContainer.classList.add('hidden'); authChoice.classList.remove('hidden'); };
 let selectedHobbies=[]; window._regImages=[];
 document.querySelectorAll('.hobby-btn').forEach(b=>{
  b.onclick=()=>{
   const h=b.dataset.h;
   if(selectedHobbies.includes(h)) selectedHobbies=selectedHobbies.filter(x=>x!==h);
   else selectedHobbies.push(h);
   b.classList.toggle('bg-[#ff2e93]'); b.classList.toggle('text-white');
  };
 });
 async function handleFileList(files){
  for(let f of files){ const b64=await fileToBase64(f); window._regImages.push(b64); }
  window._regImages=window._regImages.slice(0,8);
  const prev=document.getElementById('r_preview');
  prev.innerHTML=window._regImages.map((img,i)=>`<div class="relative"><img src="${img}" class="w-full h-[64px] rounded-[12px] object-cover border border-white/10" /><button data-i="${i}" class="del-img absolute -top-1 -right-1 w-5 h-5 rounded-full bg-black text-white text-[10px]">✕</button>${i===0?'<span class="absolute bottom-1 left-1 text-[8px] px-1 rounded bg-[#ff2e93] text-white">FŐ</span>':''}</div>`).join('');
  prev.querySelectorAll('.del-img').forEach(btn=>btn.onclick=()=>{ window._regImages.splice(parseInt(btn.dataset.i),1); handleFileList([]); });
 }
 document.getElementById('r_files')?.addEventListener('change', e=>handleFileList(Array.from(e.target.files)));
 document.getElementById('r_camera')?.addEventListener('change', e=>handleFileList(Array.from(e.target.files)));
 document.getElementById('l_submit')?.addEventListener('click', async ()=>{
  const email=document.getElementById('l_email').value.trim();
  const pass=document.getElementById('l_pass').value.trim();
  if(!email||!pass) return alert('Add meg emailt és jelszót');
  try{
   const res=await fetch('/api/login',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,password:pass})});
   const data=await res.json();
   if(data.user){ currentUser=data.user; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); location.reload(); }
   else alert(data.message||'Hiba');
  }catch{
   let local=JSON.parse(localStorage.getItem('lovenux_v2_user')||'null');
   if(local && local.email && local.email.toLowerCase()===email.toLowerCase()){ currentUser=local; location.reload(); }
   else alert('Nincs ilyen felhasználó');
  }
 });
 document.getElementById('r_submit')?.addEventListener('click', ()=>{
  const get=id=>document.getElementById(id).value;
  const errEl=document.getElementById('r_err');
  const showErr=t=>{ errEl.textContent=t; errEl.classList.remove('hidden'); };
  if(!get('r_email')||!get('r_name')) return showErr('Email és név kötelező');
  if(window._regImages.length===0) return showErr('Tölts fel legalább 1 képet');
  if(!document.getElementById('c18').checked) return showErr('18+ kötelező');
  if(!document.getElementById('caszf').checked) return showErr('ÁSZF kötelező');
  if(!document.getElementById('cadat').checked) return showErr('Adatkezelés kötelező');
  const fd=new FormData();
  fd.append('email',get('r_email')); fd.append('password',document.getElementById('r_pass').value);
  fd.append('name',get('r_name')); fd.append('age',get('r_age')); fd.append('gender',get('r_gender').value);
  fd.append('lookingFor',get('r_looking')); fd.append('location',get('r_city')); fd.append('phone',get('r_phone'));
  fd.append('bio',get('r_bio')); fd.append('relationshipStatus',get('r_rel')); fd.append('childrenStatus',get('r_child'));
  fd.append('height',get('r_height')); fd.append('bodyType',get('r_body')); fd.append('education',get('r_edu'));
  fd.append('hobbies',JSON.stringify(selectedHobbies));
  window._regImages.forEach(b64=>{ const arr=b64.split(','), mime=arr[0].match(/:(.*?);/)[1], bstr=atob(arr[1]); let n=bstr.length, u8=new Uint8Array(n); while(n--) u8[n]=bstr.charCodeAt(n); fd.append('images', new File([u8],'photo.jpg',{type:mime})); });
  fd.append('base64Images', JSON.stringify(window._regImages));
  register(fd);
 });
}

function renderMain(){
 const cur=filteredUsers[swipeIndex % filteredUsers.length];
 let likedByCount=likedBy.filter(id=>users.some(u=>u.id===id)).length;
 return `<div class="min-h-screen">
  <header class="sticky top-0 z-40 glass">

 document.querySelectorAll('[data-like]').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); doLike(b.dataset.like,'like'); }));
 document.querySelectorAll('.like-btn').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); doLike(b.dataset.like,'like'); }));

 document.getElementById('joinSpotlight')?.addEventListener('click', async ()=>{ try{ const res=await fetch('/api/spotlight/join',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:currentUser.id})}); const data=await res.json(); if(data.success){ if(socket) socket.emit('spotlightJoin',{userId:currentUser.id}); loadSpotlight(); } else alert(data.message||'Tele van • várakozóba kerültél'); }catch{} });

 const btnLike=document.getElementById('btnLike'); if(btnLike) btnLike.addEventListener('click', ()=>doLike(filteredUsers[swipeIndex]?.id,'like'));
 const btnNope=document.getElementById('btnNope'); if(btnNope) btnNope.addEventListener('click', ()=>{ swipeIndex++; render(); });
 const btnSuper=document.getElementById('btnSuper'); if(btnSuper) btnSuper.addEventListener('click', ()=>doLike(filteredUsers[swipeIndex]?.id,'superlike'));

 const card=document.getElementById('swipeCard');
 if(card){
  let startX=0, isDrag=false;
  const onDown=e=>{ isDrag=true; startX=e.clientX||e.touches?.[0]?.clientX||0; card.style.transition='none'; };
  const onMove=e=>{
   if(!isDrag) return;
   const x=(e.clientX||e.touches?.[0]?.clientX||0)-startX;
   dragX=x; card.style.transform=`translateX(${x}px) rotate(${x*0.08}deg)`;
   let likeEl=document.getElementById('likeStamp'), nopeEl=document.getElementById('nopeStamp');
   if(likeEl) likeEl.style.opacity=x>20?Math.min(1,x/80):'0';
   if(nopeEl) nopeEl.style.opacity=x<-20?Math.min(1,Math.abs(x)/80):'0';
  };
  const onUp=e=>{
   if(!isDrag) return; isDrag=false; card.style.transition='transform 0.35s';
   const x=(e.clientX||e.changedTouches?.[0]?.clientX||startX)-startX;
   if(x>80){ doLike(filteredUsers[swipeIndex]?.id,'like'); card.style.transform='translateX(500px) rotate(20deg)'; setTimeout(()=>{ dragX=0; render(); },250); return; }
   if(x<-80){ swipeIndex++; card.style.transform='translateX(-500px) rotate(-20deg)'; setTimeout(()=>{ dragX=0; render(); },250); return; }
   dragX=0; card.style.transform='translateX(0) rotate(0)';
  };
  card.addEventListener('pointerdown', onDown); window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp);
  card.addEventListener('touchstart', onDown,{passive:true}); window.addEventListener('touchmove', onMove,{passive:true}); window.addEventListener('touchend', onUp);
 }

 const sendBtn=document.getElementById('sendBtn');
 const msgInput=document.getElementById('msgInput');
 if(sendBtn && msgInput){
  let sending=false;
  const send=()=>{
   if(sending) return;
   let text=msgInput.value.trim(); if(!text||!activeChat) return;
   sending=true;
   if(socket && socket.connected){ socket.emit('sendMessage',{from:currentUser.id,to:activeChat,text}); }
   else {
    let key=[currentUser.id, activeChat].sort().join('__');
    if(!messages[key]) messages[key]=[];
    if(!messages[key].some(m=>m.text===text && Date.now()-m.timestamp<2000)){
     let msg={id:'local_'+Date.now(), senderId:currentUser.id, text, timestamp:Date.now()};
     messages[key].push(msg); localStorage.setItem('lovenux_v2_msgs', JSON.stringify(messages));
    }
   }
   msgInput.value=''; render();
   setTimeout(()=>{ let list=document.getElementById('msgList'); if(list) list.scrollTop=list.scrollHeight; sending=false; },300);
  };
  sendBtn.addEventListener('click', send);
  msgInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } });
 }

 document.getElementById('micTest')?.addEventListener('click', async ()=>{ try{ let s=await navigator.mediaDevices.getUserMedia({audio:true}); alert('Mikrofon működik'); s.getTracks().forEach(t=>t.stop()); }catch{ alert('Mikrofon nem elérhető'); } });
 document.getElementById('camTest')?.addEventListener('click', async ()=>{ try{ let s=await navigator.mediaDevices.getUserMedia({video:true}); alert('Kamera működik'); s.getTracks().forEach(t=>t.stop()); }catch{ alert('Kamera nem elérhető'); } });

 document.getElementById('logout')?.addEventListener('click', ()=>{ savePersistentProfile(); localStorage.removeItem('lovenux_v2_user'); location.reload(); });
 document.getElementById('changeAvatar')?.addEventListener('change', async e=>{ let f=e.target.files[0]; if(!f) return; let b64=await fileToBase64(f); currentUser.profilePic=b64; currentUser.images[0]=b64; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); render(); });
 document.getElementById('addImages')?.addEventListener('change', async e=>{ for(let f of Array.from(e.target.files)){ let b64=await fileToBase64(f); currentUser.images.push(b64); } currentUser.images=currentUser.images.slice(0,8); localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); render(); });
 document.querySelectorAll('[data-delimg]').forEach(btn=>btn.addEventListener('click', ()=>{ let i=parseInt(btn.dataset.delimg); currentUser.images.splice(i,1); if(currentUser.images.length===0) currentUser.profilePic=''; else currentUser.profilePic=currentUser.images[0]; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); render(); }));

 if(activeTab==='news'){
  fetch('/api/news').then(r=>r.json()).then(news=>{
   let el=document.getElementById('newsList');
   if(el) el.innerHTML=news.map(n=>`<div class="rounded-[20px] overflow-hidden glass"><img src="${n.image}" class="w-full h-[180px] object-cover" /><div class="p-4"><div class="font-bold">${n.title}</div><div class="text-[12px] opacity-70 mt-1">${n.desc}</div></div></div>`).join('') || '<div class="opacity-50">Nincs hír</div>';
  });
 }
}

function doLike(id,type){
 if(!id) return;
 if(type==='nope'){ swipeIndex++; render(); return; }
 if(!likes.includes(id)){ likes.push(id); localStorage.setItem('lovenux_v2_likes', JSON.stringify(likes)); }
 if(socket) socket.emit('like',{from:currentUser.id,to:id,type});
 if(Math.random()>0.35){ addNotif('💕 Új randi!!','match'); }
 swipeIndex++; render();
}
function toggleFav(id){
 if(favorites.includes(id)){ favorites=favorites.filter(x=>x!==id); }
 else{ favorites.push(id); }
 localStorage.setItem('lovenux_v2_fav', JSON.stringify(favorites)); render();
}
function openGiftModal(to){
 let gift=prompt('Ajándék: 🌹 Rózsa, 🍫 Csoki, 💎 Gyémánt, 🧸 Maci, 💋 Puszi, 🥂 Pezsgő');
 if(!gift) return;
 let found=GIFTS.find(g=>gift.includes(g.icon)||gift.toLowerCase().includes(g.name.toLowerCase())) || {icon:'🎁',name:gift};
 if(socket) socket.emit('gift',{from:currentUser.id,to,gift:found});
}
function checkBarion(){
 if(!currentUser) return;
 fetch('/api/barion/status/'+currentUser.id).then(r=>r.json()).then(d=>{
  if(d.enabled && !d.paid){
   if(document.getElementById('barionOverlay')) return;
   let div=document.createElement('div'); div.id='barionOverlay'; div.className='barionOverlay';
   div.innerHTML=`<div class="rounded-[24px] glass p-8 max-w-[360px] text-center"><div class="text-[32px]">💳</div><div class="brand text-[20px] font-bold mt-3">1000 Ft / örökre VIP</div><div class="text-[12px] opacity-70 mt-2">Belül minden ingyenes</div><button id="payBarion" class="mt-5 w-full h-12 rounded-[14px] font-bold text-white" style="background:linear-gradient(90deg,#ff2e93,#ff6b9d)">Fizetés Barionnal</button><div class="text-[10px] opacity-40 mt-3">Ellenőrzés alatt kikapcsolva - most nem kérjük</div></div>`;
   document.body.appendChild(div);
   document.getElementById('payBarion')?.addEventListener('click', async ()=>{
    try{ let res=await fetch('/api/barion/pay',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({userId:currentUser.id})}); let data=await res.json(); if(data.success){ currentUser.isPaid=true; document.getElementById('barionOverlay')?.remove(); document.getElementById('mainContent')?.classList.remove('barionBlur'); } }catch{}
   });
   document.getElementById('mainContent')?.classList.add('barionBlur');
  }
 }).catch(()=>{});
}
