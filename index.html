<body class="bg-[#f5f3ff] text-[#111] antialiased">
<div class="w-full bg-gradient-to-r from-[#a855f7] via-[#ff2e93] to-[#ff8a5b] text-white text-center text-[11px] font-black tracking-widest py-2 sticky top-0 z-[100]">REGISZTRÁLJ EGYSZER 1000FT-ÉRT ÖRÖKRE HOGY ÖRÖKRE VIP TAG LEHESS!!</div>
<div id="app"></div>
<script>
const REL=['Egyedülálló','Kapcsolatban','Bonyolult','Házas de nem működik','Elvált','Özvegy','Nyitott kapcsolatra'];
const CHILD=['Nincs gyerek','Van gyerek - nálam','Van gyerek - nem nálam','Szeretnék gyereket','Nem szeretnék gyereket','Majd később'];
const BODY=['Vékony','Átlagos','Sportos','Izmos','Telt','Molett'];
const EDU=['Általános iskola','Szakmunkás','Érettségi','Főiskola / Egyetem','Mester / Doktori'];
const HOBBIES=['Futás','Főzés','Utazás','Gasztro','Zene','Mozi','Edzés','Túrázás','Olvasás','Gaming','Fotózás','Könyv','Természet','Állatok','Művészet','Bor','Kávé','Jóga','Bulizás','Sport','Séta'];
const GIFTS=[{icon:'🌹',name:'Rózsa'},{icon:'🍫',name:'Csoki'},{icon:'💎',name:'Gyémánt'},{icon:'🧸',name:'Maci'},{icon:'💋',name:'Puszi'},{icon:'🥂',name:'Pezsgő'}];
let currentUser=null;
let savedProfiles=JSON.parse(localStorage.getItem('lovenux_saved_profiles')||'{}');
let isLoggedIn = localStorage.getItem('lovenux_isLoggedIn')==='true';
if(isLoggedIn){
  try{ currentUser=JSON.parse(localStorage.getItem('lovenux_v2_user')||'null'); }catch{ currentUser=null; }
  if(currentUser && savedProfiles[currentUser.id]){
    let sp=savedProfiles[currentUser.id];
    if(sp.profilePic) currentUser.profilePic=sp.profilePic;
    if(sp.images && sp.images.length>0) currentUser.images=sp.images;
  }
}
function savePersistentProfile(){
 if(!currentUser) return;
 const data={id:currentUser.id, profilePic:currentUser.profilePic, images:currentUser.images||[], name:currentUser.name};
 localStorage.setItem('lovenux_persistent_profile', JSON.stringify(data));
 let all=JSON.parse(localStorage.getItem('lovenux_saved_profiles')||'{}');
 all[currentUser.id]=data; localStorage.setItem('lovenux_saved_profiles', JSON.stringify(all));
 try{ if(socket) socket.emit('updateProfilePic',{userId:currentUser.id, profilePic:currentUser.profilePic, images:currentUser.images}); }catch{}
}
window.addEventListener('beforeunload', savePersistentProfile);
let users=[], filteredUsers=[], swipeIndex=0, activeTab='fooldal', activeChat=null;
let messages=JSON.parse(localStorage.getItem('lovenux_v2_msgs')||'{}');
let likes=JSON.parse(localStorage.getItem('lovenux_v2_likes')||'[]');
let likedBy=JSON.parse(localStorage.getItem('lovenux_likedBy')||'[]');
let favorites=JSON.parse(localStorage.getItem('lovenux_v2_fav')||'[]');
let notifications=JSON.parse(localStorage.getItem('lovenux_notif')||'[]');
let spotlightData=[], spotlightWaiting=[], spotlightTopMale=null, spotlightTopFemale=null, spotlightDuels=[];
let socket=null;
function initSocket(){
 if(!currentUser) return;
 try{ socket=io(); }catch{ return; }
 socket.emit('join', currentUser.id);
 socket.on('newMessage', ({key,message})=>{
  if(!messages[key]) messages[key]=[];
  if(messages[key].some(m=>m.id===message.id)) return;
  messages[key].push(message);
  localStorage.setItem('lovenux_v2_msgs', JSON.stringify(messages));
  if(message.senderId!==currentUser.id) addNotif('💬 Új üzenet','message');
  render();
 });
 socket.on('likedYou', ({from})=>{ if(!likedBy.includes(from)){ likedBy.push(from); localStorage.setItem('lovenux_likedBy', JSON.stringify(likedBy)); } addNotif('❤ Kedvelés érkezett','likedYou'); });
 socket.on('match', ()=>{ addNotif('💕 Új randi!!','match'); });
 socket.on('giftReceived', g=>{ addNotif('🎁 '+g.gift.icon+' '+g.gift.name,'gift'); });
 socket.on('spotlightUpdate', ()=>loadSpotlight());
}
function addNotif(text,type){
 const allowed=['match','message','gift','likedYou'];
 if(!allowed.includes(type)) return;
 if(notifications[0] && notifications[0].text===text && Date.now()-notifications[0].ts<120000) return;
 notifications.unshift({id:Date.now(), ts:Date.now(), text, type, at:new Date().toLocaleTimeString()});
 if(notifications.length>30) notifications.pop();
 localStorage.setItem('lovenux_notif', JSON.stringify(notifications));
}
async function fetchUsers(){
 try{ const res=await fetch('/api/users'); users=await res.json(); }catch{
  users=[
   {id:'u2', name:'Anna, 24', age:24, gender:'Nő', lookingFor:'Férfi', location:'Budapest, V.', bio:'Kávé, nevetés.', hobbies:['Utazás'], profilePic:'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&q=80', images:['https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&q=80'], relationshipStatus:'Egyedülálló', childrenStatus:'Nincs gyerek', height:168, bodyType:'Átlagos', education:'Egyetem', eye:'Kék', hair:'Szőke', job:'Marketing', smoke:'Nem dohányzom', drink:'Alkalmi', pet:'Pog', isVIP:true, isOnline:true},
  ];
 }
 applyFilter();
}
function applyFilter(){
 if(!currentUser){ filteredUsers=users; return; }
 let target;
 if(currentUser.lookingFor==='Nő' || currentUser.lookingFor==='Nőket') target='Nő';
 else if(currentUser.lookingFor==='Férfi' || currentUser.lookingFor==='Férfiakat') target='Férfi';
 else target=currentUser.gender==='Nő'?'Férfi':'Nő';
 filteredUsers=users.filter(u=>u.gender===target && u.id!==currentUser.id);
 if(filteredUsers.length===0) filteredUsers=users.filter(u=>u.id!==currentUser.id);
}
function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
async function register(fd){
 try{
  const res=await fetch('/api/register',{method:'POST', body:fd});
  const data=await res.json();
  if(data.user){ currentUser=data.user; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); localStorage.setItem('lovenux_isLoggedIn','true'); savePersistentProfile(); location.reload(); }
  else alert(data.message||'Hiba');
 }catch(e){ alert('Hiba: '+e.message); }
}
async function loadSpotlight(){
 try{ const r=await fetch('/api/spotlight'); const d=await r.json(); spotlightData=d.active||[]; spotlightWaiting=d.waiting||[]; spotlightTopMale=d.topMale; spotlightTopFemale=d.topFemale; spotlightDuels=d.duels||[]; }catch{}
}
function render(){ const root=document.getElementById('app'); if(!currentUser){ root.innerHTML=renderLanding(); bindLanding(); return; } root.innerHTML=renderMain(); bindMain(); checkBarion(); }
function renderLanding(){
 return `<div class="min-h-screen bg-[#08080a] flex flex-col"><div class="flex-1 flex items-center justify-center px-6 py-8"><div class="w-full max-w-[440px]"><div id="authChoice" class="rounded-[28px] bg-white p-8 text-center"><div class="w-16 h-16 rounded-[20px] bg-gradient-to-br from-[#a855f7] to-[#ff2e93] mx-auto flex items-center justify-center text-[32px] font-black text-white">💜</div><h1 class="brand text-[28px] font-[800] mt-5">Lovenux</h1><p class="text-[12px] opacity-60 mt-1">Ahol bejön az élet • 1000 Ft örökre VIP</p><div class="mt-8 grid gap-3"><button id="openLogin" class="h-[54px] rounded-[16px] bg-black text-white font-bold text-[15px]">Belépés</button><button id="openRegister" class="h-[54px] rounded-[16px] font-bold text-[15px] text-white bg-gradient-to-r from-[#a855f7] to-[#ff2e93]">Regisztráció</button></div></div><div id="regContainer" class="hidden rounded-[28px] bg-white p-6 mt-4"><div class="flex items-center justify-between"><h2 class="brand text-[20px] font-bold">Regisztráció</h2><button id="closeRegister" class="w-9 h-9 rounded-full bg-black/10">✕</button></div><div class="mt-6 grid gap-3"><div class="grid grid-cols-2 gap-3"><div><label class="text-[11px] opacity-60">Email</label><input id="r_email" class="mt-1 w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]" /></div><div><label class="text-[11px] opacity-60">Jelszó</label><input id="r_pass" type="password" class="mt-1 w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]" /></div></div><div class="grid grid-cols-[1fr_90px] gap-3"><div><label class="text-[11px] opacity-60">Név</label><input id="r_name" class="mt-1 w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]" /></div><div><label class="text-[11px] opacity-60">Kor</label><input id="r_age" type="number" value="24" class="mt-1 w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]" /></div></div><div class="grid grid-cols-2 gap-3"><div><label class="text-[11px] opacity-60">Nemed</label><select id="r_gender" class="mt-1 w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]"><option>Nő</option><option>Férfi</option></select></div><div><label class="text-[11px] opacity-60">Kit keresel</label><select id="r_looking" class="mt-1 w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]"><option>Nőket</option><option>Férfiakat</option><option>Mindkettő</option></select></div></div><div class="grid grid-cols-2 gap-3"><div><label class="text-[11px] opacity-60">Város</label><input id="r_city" value="Budapest" class="mt-1 w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]" /></div><div><label class="text-[11px] opacity-60">Telefon privát</label><input id="r_phone" placeholder="+36..." class="mt-1 w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]" /></div></div><div class="grid grid-cols-2 gap-3"><div><label class="text-[11px] opacity-60">Családi állapot</label><select id="r_rel" class="mt-1 w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]">${REL.map(o=>`<option>${o}</option>`).join('')}</select></div><div><label class="text-[11px] opacity-60">Gyerekstátusz</label><select id="r_child" class="mt-1 w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]">${CHILD.map(o=>`<option>${o}</option>`).join('')}</select></div></div><div class="grid grid-cols-2 gap-3"><div><label class="text-[11px] opacity-60">Magasság cm</label><input id="r_height" type="number" value="170" class="mt-1 w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]" /></div><div><label class="text-[11px] opacity-60">Testalkat</label><select id="r_body" class="mt-1 w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]">${BODY.map(o=>`<option>${o}</option>`).join('')}</select></div></div><div><label class="text-[11px] opacity-60">Iskolai végzettség</label><select id="r_edu" class="mt-1 w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]">${EDU.map(o=>`<option>${o}</option>`).join('')}</select></div><div><label class="text-[11px] opacity-60">Bemutatkozás</label><textarea id="r_bio" rows="2" class="mt-1 w-full rounded-[14px] bg-[#f6f5ff] border border-black/10 p-3 text-[13px]"></textarea></div><div><label class="text-[11px] opacity-60">Hobbi</label><div class="mt-2 flex flex-wrap gap-2">${HOBBIES.map(h=>`<button type="button" data-h="${h}" class="hobby-btn px-3 py-1.5 rounded-full text-[11px] border bg-[#f6f5ff] border-black/10">${h}</button>`).join('')}</div></div><div class="rounded-[16px] bg-[#f6f5ff] border border-black/10 p-4"><div class="font-bold text-[12px]">📷 telefonos képválasztás • 🖼️ galéria • 📸 kamera • 🔄 törlés/cseréje</div><div class="mt-3 flex gap-2"><label class="flex-1 h-11 rounded-[12px] bg-black text-white font-bold text-[12px] flex items-center justify-center cursor-pointer">🖼️ Galéria<input type="file" id="r_files" accept="image/*" multiple class="hidden" /></label><label class="flex-1 h-11 rounded-[12px] bg-white border border-black/10 font-bold text-[12px] flex items-center justify-center cursor-pointer">📸 Kamera<input type="file" id="r_camera" accept="image/*" capture="user" class="hidden" /></label></div><div id="r_preview" class="mt-3 grid grid-cols-4 gap-2"></div></div><div class="rounded-[14px] bg-[#f6f5ff] border border-black/10 p-3.5 space-y-3"><label class="flex gap-3"><input id="c18" type="checkbox" /><span class="text-[12px]">🔞 Elmúltam 18 éves</span></label><label class="flex gap-3"><input id="caszf" type="checkbox" /><span class="text-[12px]">📄 Elfogadom az ÁSZF-et</span></label><label class="flex gap-3"><input id="cadat" type="checkbox" /><span class="text-[12px]">🔏 Elfogadom az Adatkezelést</span></label></div><div id="r_err" class="hidden text-[12px] text-[#ff2e93] bg-[#ff2e93]/10 border border-[#ff2e93]/20 rounded-[10px] px-3 py-2"></div><button id="r_submit" class="h-[48px] rounded-[14px] font-bold text-[14px] text-white bg-gradient-to-r from-[#a855f7] to-[#ff2e93]">Regisztráció • 1000 Ft örökre VIP</button></div></div></div></div><div id="loginModal" class="hidden fixed inset-0 z-[200] bg-black/80 backdrop-blur-[16px] flex items-center justify-center p-4"><div class="w-full max-w-[420px] rounded-[28px] bg-white p-7"><div class="flex items-center justify-between"><h2 class="brand text-[22px] font-bold">Belépés</h2><button id="closeLogin" class="w-9 h-9 rounded-full bg-black/10">✕</button></div><div class="mt-6 grid gap-2"><input id="l_email" placeholder="Email" class="w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]" /><input id="l_pass" type="password" placeholder="Jelszó" class="w-full h-11 rounded-[14px] bg-[#f6f5ff] border border-black/10 px-3 text-[13px]" /><button id="l_submit" class="h-[46px] rounded-[14px] font-bold text-white bg-gradient-to-r from-[#a855f7] to-[#ff2e93]">Belépés</button></div></div></div></div>`;
}
function bindLanding(){
 const loginModal=document.getElementById('loginModal');
 document.getElementById('openLogin')?.addEventListener('click', ()=>loginModal.classList.remove('hidden'));
 document.getElementById('closeLogin')?.addEventListener('click', ()=>loginModal.classList.add('hidden'));
 loginModal?.addEventListener('click', e=>{ if(e.target===loginModal) loginModal.classList.add('hidden'); });
 document.getElementById('openRegister')?.addEventListener('click', ()=>{ document.getElementById('regContainer').classList.remove('hidden'); document.getElementById('authChoice').classList.add('hidden'); });
 document.getElementById('closeRegister')?.addEventListener('click', ()=>{ document.getElementById('regContainer').classList.add('hidden'); document.getElementById('authChoice').classList.remove('hidden'); });
 let selectedHobbies=[]; window._regImages=[];
 document.querySelectorAll('.hobby-btn').forEach(b=>{
  b.onclick=()=>{
   const h=b.dataset.h;
   if(selectedHobbies.includes(h)) selectedHobbies=selectedHobbies.filter(x=>x!==h);
   else selectedHobbies.push(h);
   b.classList.toggle('bg-[#a855f7]'); b.classList.toggle('text-white');
  };
 });
 async function handleFileList(files){
  for(let f of files){ const b64=await fileToBase64(f); window._regImages.push(b64); }
  window._regImages=window._regImages.slice(0,8);
  const prev=document.getElementById('r_preview');
  prev.innerHTML=window._regImages.map((img,i)=>`<div class="relative"><img src="${img}" class="w-full h-[64px] rounded-[12px] object-cover border border-black/10" /><button data-i="${i}" class="del-img absolute -top-1 -right-1 w-5 h-5 rounded-full bg-black text-white text-[10px]">✕</button>${i===0?'<span class="absolute bottom-1 left-1 text-[8px] px-1 rounded bg-[#a855f7] text-white">FŐ</span>':''}</div>`).join('');
  prev.querySelectorAll('.del-img').forEach(btn=>btn.onclick=()=>{ window._regImages.splice(parseInt(btn.dataset.i),1); handleFileList([]); });
 }
 document.getElementById('r_files')?.addEventListener('change', e=>handleFileList(Array.from(e.target.files)));
 document.getElementById('r_camera')?.addEventListener('change', e=>handleFileList(Array.from(e.target.files)));
 document.getElementById('l_submit')?.addEventListener('click', async ()=>{
  const email=document.getElementById('l_email').value.trim();
  const pass=document.getElementById('l_pass').value.trim();
  if(!email||!pass) return alert('Add meg emailt és jelszót');
  try{
   const res=await fetch('/api/login',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,password:pass})});
   const data=await res.json();
   if(data.user){ currentUser=data.user; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); localStorage.setItem('lovenux_isLoggedIn','true'); savePersistentProfile(); location.reload(); }
   else alert(data.message||'Hiba');
  }catch{ alert('Nincs ilyen felhasználó'); }
 });
 document.getElementById('r_submit')?.addEventListener('click', ()=>{
  const get=id=>document.getElementById(id).value;
  const errEl=document.getElementById('r_err');
  const showErr=t=>{ errEl.textContent=t; errEl.classList.remove('hidden'); };
  if(!get('r_email')||!get('r_name')) return showErr('Email és név kötelező');
  if(window._regImages.length===0) return showErr('Tölts fel legalább 1 képet');
  if(!document.getElementById('c18').checked) return showErr('18+ kötelező');
  if(!document.getElementById('caszf').checked) return showErr('ÁSZF kötelező');
  if(!document.getElementById('cadat').checked) return showErr('Adatkezelés kötelező');
  const fd=new FormData();
  fd.append('email',get('r_email')); fd.append('password',document.getElementById('r_pass').value);
  fd.append('name',get('r_name')); fd.append('age',get('r_age')); fd.append('gender',get('r_gender').value);
  fd.append('lookingFor',get('r_looking')); fd.append('location',get('r_city')); fd.append('phone',get('r_phone'));
  fd.append('bio',get('r_bio')); fd.append('relationshipStatus',get('r_rel')); fd.append('childrenStatus',get('r_child'));
  fd.append('height',get('r_height')); fd.append('bodyType',get('r_body')); fd.append('education',get('r_edu'));
  fd.append('hobbies',JSON.stringify(selectedHobbies));
  window._regImages.forEach(b64=>{ const arr=b64.split(','), mime=arr[0].match(/:(.*?);/)[1], bstr=atob(arr[1]); let n=bstr.length, u8=new Uint8Array(n); while(n--) u8[n]=bstr.charCodeAt(n); fd.append('images', new File([u8],'photo.jpg',{type:mime})); });
  fd.append('base64Images', JSON.stringify(window._regImages));
  register(fd);
 });
}

 const cur = filteredUsers[swipeIndex % filteredUsers.length] || users[0];
 const leftNav = `

      <button data-tab="kartyajatekok" class="flex items-center gap-3 px-3 h-[44px] rounded-[12px] text-[13px] font-bold ${activeTab==='kartyajatekok'?'bg-[#a855f7]/30 text-white':'text-white/80 hover:bg-white/10'}">🎴 Kártyajátékok</button>
      <button data-tab="poker" class="flex items-center gap-3 px-3 h-[44px] rounded-[12px] text-[13px] font-bold ${activeTab==='poker'?'bg-[#a855f7]/30 text-white':'text-white/80 hover:bg-white/10'}">♠️ Poker</button>
      <button data-tab="profilom" class="flex items-center gap-3 px-3 h-[44px] rounded-[12px] text-[13px] font-bold ${activeTab==='profilom'?'bg-[#a855f7]/30 text-white':'text-white/80 hover:bg-white/10'}">👤 Profilom</button>
      <button data-tab="kedvenceim" class="flex items-center gap-3 px-3 h-[44px] rounded-[12px] text-[13px] font-bold ${activeTab==='kedvenceim'?'bg-[#a855f7]/30 text-white':'text-white/80 hover:bg-white/10'}">❤️ Kedvenceim</button>
      <button data-tab="latogatok" class="flex items-center gap-3 px-3 h-[44px] rounded-[12px] text-[13px] font-bold ${activeTab==='latogatok'?'bg-[#a855f7]/30 text-white':'text-white/80 hover:bg-white/10'}">👁️ Látogatók</button>
      <button data-tab="beallitasok" class="flex items-center gap-3 px-3 h-[44px] rounded-[12px] text-[13px] font-bold ${activeTab==='beallitasok'?'bg-[#a855f7]/30 text-white':'text-white/80 hover:bg-white/10'}">⚙️ Beállítások</button>`;

 let mainInner='';
 if(activeTab==='fooldal' && cur){
  mainInner=`
  <div id="swipeCard" class="swipe-card">
    <div class="relative">
      <img src="${cur.profilePic}" class="mobile-profile-img w-full h-[520px] md:h-[640px] object-cover object-top" />
      <div class="absolute top-3 left-3 px-3 py-1.5 rounded-full bg-black/60 text-white text-[11px]"> ${cur.age} - ${cur.location} </div>
      <div class="absolute top-3 right-3 px-3 py-1.5 rounded-full bg-[#ff2e93] text-white text-[11px]">Online</div>
      <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 to-transparent p-4 text-white md:hidden">
        <div class="font-bold text-[20px]">${cur.name}</div>
        <div class="text-[12px] opacity-80">📍 ${cur.gender} - ${cur.location}</div>
      </div>
    </div>
    <div class="p-3 md:p-5 bg-white">
      <div class="hidden md:block text-center mb-3"><div class="font-bold text-[20px]">${cur.name}</div><div class="text-[12px] opacity-60">📍 ${cur.gender} - ${cur.location}</div></div>
      <div class="flex flex-wrap gap-2 mb-3">${(cur.hobbies||['Utazás']).map(h=>`<span class="tag-pill">✈️ ${h}</span>`).join('')}</div>
      <div class="text-[14px] bg-[#fbf9ff] rounded-[14px] p-3 border border-[#ece8ff] mb-4">${cur.bio}</div>
      <div class="grid grid-cols-2 gap-2 mb-3">
        <button data-fav="${cur.id}" class="h-11 rounded-full bg-[#ede9ff] text-[#6d28d9] text-[12px] font-bold">💜 Kedvencek</button>
        <button data-super="${cur.id}" class="h-11 rounded-full bg-[#ede9ff] text-[#6d28d9] text-[12px] font-bold">⭐ Szuperlike</button>
        <button data-like="${cur.id}" class="h-12 rounded-full btn-pink text-[14px] font-bold">🔥 Tetszik</button>
        <button data-chat="${cur.id}" class="h-11 rounded-full bg-[#ede9ff] text-[#6d28d9] text-[12px] font-bold">✉️ Üzenet</button>
        <button data-gift="${cur.id}" class="h-11 rounded-full bg-[#ede9ff] text-[#6d28d9] text-[12px] font-bold">🎁 Ajándék</button>
        <button class="h-11 rounded-full bg-[#ede9ff] text-[#6d28d9] text-[12px] font-bold">⚡ Boost</button>
      </div>
      <div class="flex gap-2 mb-4"><button id="btnNope" class="flex-1 h-12 rounded-full bg-white border border-black/10 text-[14px] font-bold">✕ Nem</button><button id="btnLike" class="flex-1 h-12 rounded-full btn-pink text-[14px] font-bold">Igen 💜</button><button id="btnSuper" class="flex-1 h-12 rounded-full btn-yellow text-[14px] font-bold">Szuper</button></div>
      <div class="grid grid-cols-2 gap-2 mb-3"><div class="info-box"><div class="info-label">Magasság</div><div class="info-val">${cur.height||168} cm</div></div><div class="info-box"><div class="info-label">Test</div><div class="info-val">${cur.bodyType||'Átlagos'}</div></div><div class="info-box"><div class="info-label">Szem</div><div class="info-val">${cur.eye||'Kék'}</div></div><div class="info-box"><div class="info-label">Haj</div><div class="info-val">${cur.hair||'Szőke'}</div></div><div class="info-box"><div class="info-label">Végzettség</div><div class="info-val">${cur.education||'Egyetem'}</div></div><div class="info-box"><div class="info-label">Munka</div><div class="info-val">${cur.job||'Marketing'}</div></div></div>
      <div class="flex justify-center gap-4 text-[11px] opacity-60"><button id="micTest">📞 Mikrofon teszt</button><button id="camTest">🎥 Kamera teszt</button></div>
      <div class="md:hidden text-center mt-3 text-[10px] opacity-40">👉 Húzd jobbra = Igen, balra = Nem</div>
    </div>
  </div>`;
 } else {
  let backBtn = `<button onclick="activeTab='fooldal'; render()" class="mb-3 flex items-center gap-2 px-5 h-11 rounded-full bg-black text-white text-[13px] font-bold"><span>←</span> Vissza a főoldalra</button>`;
  if(activeTab==='rivaldafeny'){
   mainInner = backBtn + `<h2 class="font-bold text-[16px] p-2">👑 Rivaldafény • ${spotlightData.length}/100 • 50👨 50👩 • 1óra • szavazás • párbaj • nap férfija/nője</h2><div class="grid grid-cols-2 md:grid-cols-4 gap-2 p-2">${spotlightData.map(s=>{ let u=users.find(x=>x.id===s.userId); if(!u) return ''; return `<div class="bg-white border rounded-[12px] overflow-hidden"><img src="${u.profilePic}" class="w-full h-[160px] object-cover" /><div class="p-2"><div class="font-bold text-[11px]">${u.name}</div><button data-vote="${u.id}" class="w-full h-8 rounded-full bg-black text-white text-[11px] mt-1">Szavaz</button></div></div>`}).join('') || 'Nincs résztvevő'}</div>`;
  } else if(activeTab==='profilom'){
   mainInner = backBtn + `<div class="p-3 grid gap-3"><img src="${currentUser.profilePic}" class="w-full h-[500px] object-cover rounded-[16px] object-top" /><div class="grid grid-cols-4 gap-2">${(currentUser.images||[]).map((img,i)=>`<div class="relative"><img src="${img}" class="w-full h-[70px] rounded-[10px] object-cover" /><button data-delimg="${i}" class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-black text-white text-[10px]">✕</button></div>`).join('')}</div><label class="h-11 rounded-full bg-black text-white flex items-center justify-center font-bold text-[12px]">+ Kép galéria / kamera<input type="file" id="addImages" accept="image/*" multiple class="hidden" /></label><input id="p_name" value="${currentUser.name}" class="h-11 rounded-[12px] border px-3" /><textarea id="p_bio" class="rounded-[12px] border p-3">${currentUser.bio}</textarea><button id="saveProfile" class="h-12 rounded-full bg-black text-white font-bold">Mentés</button><button id="logout" class="h-11 rounded-full bg-[#f0eeff] text-[#6d28d9] font-bold">Kilépés - vissza loginra</button></div>`;
  } else {
   mainInner = backBtn + `<div class="p-4"><h3 class="font-bold">${activeTab}</h3><p class="opacity-60 mt-2">Tartalom</p></div>`;
  }
 }

 return `<div class="min-h-screen bg-[#f5f3ff] flex flex-col">
  <div class="love-top h-[56px] flex items-center px-3 justify-between text-white sticky top-[28px] z-[70]">
    <div class="flex items-center gap-2"><button id="mobMenu" class="md:hidden w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">☰</button><span class="font-black text-[20px]">💜</span><span class="brand font-bold">Lovenux</span></div>
    <div class="flex items-center gap-2"><button data-tab="messages" class="px-3 h-9 rounded-full bg-white/20 text-[11px]">💬 Üzenetek</button><div class="w-8 h-8 rounded-full overflow-hidden border-2 border-white/40"><img src="${currentUser.profilePic}" class="w-full h-full object-cover" /></div></div>
  </div>
  <div class="flex flex-1">
    <aside id="leftNavMain" class="left-nav hidden md:flex w-[250px] flex-col p-3 gap-1 fixed md:static inset-y-0 left-0 z-[80] pt-[80px] md:pt-3 h-screen md:h-auto overflow-auto">
      <button id="closeMenu" class="md:hidden self-end w-9 h-9 rounded-full bg-white/10 text-white mb-2">✕</button>
      ${leftNav}
    </aside>
    <div id="mobileOverlay" class="hidden fixed inset-0 bg-black/50 z-[70] md:hidden"></div>
    <main id="mainContent" class="flex-1 w-full bg-[#f5f3ff] md:p-4">
      <div class="max-w-[900px] mx-auto bg-white md:rounded-[18px] overflow-hidden shadow-sm">
        ${mainInner}
      </div>
    </main>
  </div>
</div>`;
}
function bindMain(){
 document.getElementById('mobMenu')?.addEventListener('click', ()=>{ document.getElementById('leftNavMain').classList.remove('hidden'); document.getElementById('leftNavMain').classList.add('flex'); document.getElementById('mobileOverlay').classList.remove('hidden'); });
 document.getElementById('closeMenu')?.addEventListener('click', ()=>{ document.getElementById('leftNavMain').classList.add('hidden'); document.getElementById('mobileOverlay').classList.add('hidden'); });
 document.getElementById('mobileOverlay')?.addEventListener('click', ()=>{ document.getElementById('leftNavMain').classList.add('hidden'); document.getElementById('mobileOverlay').classList.add('hidden'); });
 document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click', ()=>{ activeTab=b.dataset.tab; document.getElementById('leftNavMain')?.classList.add('hidden'); document.getElementById('mobileOverlay')?.classList.add('hidden'); render(); }));
 document.querySelectorAll('[data-like]').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); doLike(b.dataset.like,'like'); }));
 document.querySelectorAll('[data-super]').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); doLike(b.dataset.super,'superlike'); }));
 document.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click', ()=>{ let id=b.dataset.fav; if(!favorites.includes(id)){ favorites.push(id); localStorage.setItem('lovenux_v2_fav', JSON.stringify(favorites)); } render(); }));
 document.querySelectorAll('[data-chat]').forEach(el=>el.addEventListener('click', ()=>{ activeChat=el.dataset.chat; activeTab='messages'; render(); }));
 document.getElementById('btnLike')?.addEventListener('click', ()=>doLike(filteredUsers[swipeIndex]?.id,'like'));
 document.getElementById('btnNope')?.addEventListener('click', ()=>{ swipeIndex++; render(); });
 document.getElementById('btnSuper')?.addEventListener('click', ()=>doLike(filteredUsers[swipeIndex]?.id,'superlike'));
 const card=document.getElementById('swipeCard');
 if(card){
   let startX=0;
   card.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; }, {passive:true});
   card.addEventListener('touchend', e=>{
     let dx=e.changedTouches[0].clientX-startX;
     if(dx>80){ doLike(filteredUsers[swipeIndex]?.id,'like'); }
     else if(dx<-80){ swipeIndex++; render(); }
   });
 }
 document.getElementById('saveProfile')?.addEventListener('click', ()=>{
  currentUser.name=document.getElementById('p_name')?.value||currentUser.name;
  currentUser.bio=document.getElementById('p_bio')?.value||currentUser.bio;
  localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); render();
 });
 document.getElementById('logout')?.addEventListener('click', ()=>{
  savePersistentProfile();
  localStorage.removeItem('lovenux_isLoggedIn');
  currentUser=null; isLoggedIn=false; location.reload();
 });
 document.getElementById('addImages')?.addEventListener('change', async e=>{
  for(let f of Array.from(e.target.files)){ let b64=await fileToBase64(f); currentUser.images.push(b64); }
  currentUser.images=currentUser.images.slice(0,8);
  if(currentUser.images[0]) currentUser.profilePic=currentUser.images[0];
  localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); render();
 });
 document.querySelectorAll('[data-delimg]').forEach(btn=>btn.addEventListener('click', ()=>{ let i=parseInt(btn.dataset.delimg); currentUser.images.splice(i,1); if(currentUser.images.length===0) currentUser.profilePic=''; else currentUser.profilePic=currentUser.images[0]; localStorage.setItem('lovenux_v2_user', JSON.stringify(currentUser)); savePersistentProfile(); render(); }));
 document.getElementById('micTest')?.addEventListener('click', async ()=>{ try{ let s=await navigator.mediaDevices.getUserMedia({audio:true}); alert('Mikrofon működik'); s.getTracks().forEach(t=>t.stop()); }catch{ alert('Mikrofon nem elérhető'); } });
 document.getElementById('camTest')?.addEventListener('click', async ()=>{ try{ let s=await navigator.mediaDevices.getUserMedia({video:true}); alert('Kamera működik'); s.getTracks().forEach(t=>t.stop()); }catch{ alert('Kamera nem elérhető'); } });
}
function doLike(id,type){
 if(!id) return;
 if(!likes.includes(id)){ likes.push(id); localStorage.setItem('lovenux_v2_likes', JSON.stringify(likes)); }
 if(socket) socket.emit('like',{from:currentUser.id,to:id,type});
 if(Math.random()>0.35){ addNotif('💕 Új randi!!','match'); }
 swipeIndex++; render();
}
function checkBarion(){
 if(!currentUser) return;
 fetch('/api/barion/status/'+currentUser.id).then(r=>r.json()).then(d=>{
  if(d.enabled && !d.paid){
   if(document.getElementById('barionOverlay')) return;
   let div=document.createElement('div'); div.id='barionOverlay'; div.className='barionOverlay';
   div.innerHTML=`<div class="rounded-[24px] bg-white p-8 max-w-[360px] text-center"><div class="text-[32px]">💳</div><div class="brand text-[20px] font-bold mt-3">1000 Ft / örökre VIP</div><div class="text-[12px] opacity-70 mt-2">Belül minden ingyenes</div><button id="payBarion" class="mt-5 w-full h-12 rounded-[14px] font-bold text-white bg-gradient-to-r from-[#a855f7] to-[#ff2e93]">Fizetés Barionnal</button></div>`;
   document.body.appendChild(div);
  }
 }).catch(()=>{});
}
(async ()=>{ await fetchUsers(); await loadSpotlight(); if(currentUser) initSocket(); render(); })();
</script>
</body>
</html>
